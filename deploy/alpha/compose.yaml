# JulOS 0.3.0 alpha evaluation stack.
#
# This stack deliberately contains only the control plane and its database.
# Package workers and session runtimes are added separately when their package
# is enabled. Do not expose this alpha directly to the public internet.

name: julos-alpha

x-server: &server
  image: ${JULOS_SERVER_IMAGE:-ghcr.io/juloc/julos-server:0.4.0-beta.11}
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: 8080
    ConnectionStrings__CoreDatabase: >-
      Host=postgres;Port=5432;Database=${JULOS_POSTGRES_DB:-julos};Username=${JULOS_POSTGRES_USER:-julos};Password=${JULOS_POSTGRES_PASSWORD:?Set JULOS_POSTGRES_PASSWORD in deploy/alpha/.env}
    Secrets__ActiveKeyId: primary
    Secrets__KeyRingPath: /run/julos-secret-keys
    Secrets__LeaseLifetimeSeconds: 300
    Remote__Display__ProviderEndpointTemplate: ${JULOS_REMOTE_DISPLAY_PROVIDER_ENDPOINT_TEMPLATE:-}
    Remote__Display__PublicOrigin: ${JULOS_REMOTE_DISPLAY_PUBLIC_ORIGIN:-}
    Remote__Display__GrantLifetimeSeconds: ${JULOS_REMOTE_DISPLAY_GRANT_LIFETIME_SECONDS:-60}
  secrets:
    - source: julos-primary-key
      target: /run/julos-secret-keys/primary.key
      uid: "1654"
      gid: "1654"
      mode: 0400
  volumes:
    - data-protection:/var/lib/julos/data-protection
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:18.2-alpine
    environment:
      POSTGRES_DB: ${JULOS_POSTGRES_DB:-julos}
      POSTGRES_USER: ${JULOS_POSTGRES_USER:-julos}
      POSTGRES_PASSWORD: ${JULOS_POSTGRES_PASSWORD:?Set JULOS_POSTGRES_PASSWORD in deploy/alpha/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *server
    command: ["dotnet", "/application/JulOS.Server.dll", "--migrate-database"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *server
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${JULOS_BIND_ADDRESS:-127.0.0.1}:${JULOS_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "gosu", "1654:1654", "dotnet", "/application/JulOS.Server.dll", "--health-check"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

secrets:
  julos-primary-key:
    environment: JULOS_PRIMARY_KEY

volumes:
  data-protection:
  postgres-data:
