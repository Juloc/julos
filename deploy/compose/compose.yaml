# JulOS development stack.
#
# Start from this directory:
#   cp .env.example .env      # then set a password
#   docker compose up --build
#
# This file is for development. Package workers and package-owned session
# runtimes (for example Remote provider) join the stack with the work items
# that implement them; only Runtime Manager and its own container network
# are wired here.
#
# Remote (RDP/VNC/SSH) requires the runtime-manager service, a shared
# runtime network, and compose.remote.yaml layered on top:
#   docker compose -f compose.yaml -f compose.remote.yaml --profile remote up --build
# Remote__Providers and Remote__NetworkProfiles are NOT set here even to
# empty defaults: ConfiguredRemoteRuntimePolicy.Read validates every entry
# whose keys are present at all (regardless of value) eagerly at startup, so
# a blank Remote__Providers__0__* would crash the whole stack for anyone who
# is not using Remote. compose.remote.yaml only adds those keys when the
# operator explicitly layers it in.

name: julos-dev

x-server-image: &server-image
  build:
    context: ../..
    dockerfile: src/JulOS.Server/Dockerfile
  environment: &server-environment
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_HTTP_PORTS: 8080
    ConnectionStrings__CoreDatabase: >-
      Host=postgres;Port=5432;Database=${JULOS_POSTGRES_DB:-julos};Username=${JULOS_POSTGRES_USER:-julos};Password=${JULOS_POSTGRES_PASSWORD:?Set JULOS_POSTGRES_PASSWORD in deploy/compose/.env}
    Secrets__ActiveKeyId: primary
    Secrets__KeyRingPath: /run/julos-secret-keys
    Secrets__LeaseLifetimeSeconds: 300
    Packages__Root: /var/lib/julos/packages
    Remote__Display__ProviderEndpointTemplate: ${JULOS_REMOTE_DISPLAY_PROVIDER_ENDPOINT_TEMPLATE:-}
    Remote__Display__PublicOrigin: ${JULOS_REMOTE_DISPLAY_PUBLIC_ORIGIN:-}
    Remote__Display__GrantLifetimeSeconds: ${JULOS_REMOTE_DISPLAY_GRANT_LIFETIME_SECONDS:-60}
    Remote__RuntimeManager__Endpoint: ${JULOS_REMOTE_RUNTIME_MANAGER_ENDPOINT:-}
    Remote__RuntimeManager__ApiKey: ${JULOS_RUNTIME_MANAGER_KEY:-}
    Remote__ProviderCallback__Endpoint: ${JULOS_REMOTE_PROVIDER_CALLBACK_ENDPOINT:-}
    Remote__ProviderCallback__SigningKey: ${JULOS_REMOTE_PROVIDER_CALLBACK_KEY:-}
  volumes:
    - ${JULOS_SECRET_KEY_RING_PATH:?Set JULOS_SECRET_KEY_RING_PATH in deploy/compose/.env}:/run/julos-secret-keys:ro
    - packages-data:/var/lib/julos/packages

services:
  postgres:
    image: postgres:18.2-alpine
    environment:
      POSTGRES_DB: ${JULOS_POSTGRES_DB:-julos}
      POSTGRES_USER: ${JULOS_POSTGRES_USER:-julos}
      POSTGRES_PASSWORD: ${JULOS_POSTGRES_PASSWORD:?Set JULOS_POSTGRES_PASSWORD in deploy/compose/.env}
    # No port is published. The database is reachable only from the stack network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *server-image
    command: ["dotnet", "/application/JulOS.Server.dll", "--migrate-database"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *server-image
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Bound to the loopback interface. The development stack is not a public deployment.
      - "127.0.0.1:${JULOS_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "dotnet", "/application/JulOS.Server.dll", "--health-check"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - default
      - julos-remote
    restart: unless-stopped

  # Runtime Manager needs the host's Docker socket to create the narrow,
  # labeled containers it owns (Remote provider runtimes).
  # It is optional: the stack runs without it, and Remote sessions simply
  # fail closed until Remote__RuntimeManager__Endpoint is configured above.
  runtime-manager:
    build:
      context: ../..
      dockerfile: src/JulOS.RuntimeManager/Dockerfile
    environment:
      # Required only when the remote profile actually runs; RuntimeManagerOptions.Read
      # refuses to start without it, and Compose parses this file even when the
      # remote profile is not selected, so this cannot use the required (":?") form.
      RuntimeManager__ApiKey: ${JULOS_RUNTIME_MANAGER_KEY:-}
      RuntimeManager__AllowedNetworks__0: ${JULOS_REMOTE_RUNTIME_NETWORK:-julos-remote}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
    restart: unless-stopped
    profiles:
      - remote

volumes:
  postgres-data:
  packages-data:

networks:
  default:
  # Shared with every Runtime-Manager-launched Remote provider container and
  # with whatever Remote targets the operator's network profile allows. Not
  # marked external so `docker compose up` creates it; an operator pointing
  # Remote at an existing network can override RuntimeNetworks and manage the
  # network outside Compose instead.
  #
  # The explicit name pins the on-host network to `julos-remote` instead of the
  # Compose-default `<project>_julos-remote`. Runtime Manager launches runtimes
  # with a bare `docker run --network julos-remote` (its AllowedNetworks value)
  # against the host daemon, which has no knowledge of the Compose project
  # prefix, so the literal name must match or every session launch fails closed
  # with "network julos-remote not found".
  julos-remote:
    name: julos-remote
