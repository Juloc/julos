name: Fix REM-005 cookie header

on:
  pull_request:
    branches:
      - agent/complete-julos-work-breakdown
    paths:
      - .github/workflows/fix-rem-005-cookie-header.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'Juloc/julos' && github.head_ref == 'agent/rem-005-display-transport'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-005-display-transport
          persist-credentials: true

      - name: Correct cookie header indexer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/JulOS.Integration.Tests/Remote/RemoteDisplayEndpointTests.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = 'request.Headers["Cookie\\] = authentication.Cookie;'
          new = 'request.Headers["Cookie"] = authentication.Cookie;'
          if text.count(old) != 1:
              raise RuntimeError('Expected one malformed cookie header indexer.')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          node tools/normalize-encoding.mjs
          git diff --check

      - name: Commit corrected test
        shell: bash
        run: |
          set -euo pipefail
          git add tests/JulOS.Integration.Tests/Remote/RemoteDisplayEndpointTests.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(remote): correct display test cookie header'
          git push origin HEAD:agent/rem-005-display-transport
