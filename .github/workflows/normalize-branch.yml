name: Normalize branch encoding

on:
  push:
    branches:
      - agent/complete-julos-work-breakdown

permissions:
  contents: write

concurrency:
  group: normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc

      - name: Normalize tracked text
        run: node tools/normalize-encoding.mjs

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Normalize repository text encoding"
          git push origin HEAD:agent/complete-julos-work-breakdown
