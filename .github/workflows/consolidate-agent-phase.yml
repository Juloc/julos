name: Consolidate Agent phase

on:
  push:
    branches:
      - agent/complete-julos-work-breakdown

permissions:
  contents: write

concurrency:
  group: consolidate-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc

      - name: Consolidate permanent code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_if_missing(path, marker, old, new):
              file = Path(path)
              data = file.read_bytes()
              if marker in data:
                  return
              if old not in data:
                  raise SystemExit(f'missing anchor in {path}: {old!r}')
              file.write_bytes(data.replace(old, new, 1))

          replace_if_missing(
              'src/JulOS.Server/Program.cs',
              b'using JulOS.Infrastructure.Agents;',
              b'using JulOS.Infrastructure.Health;\r\n',
              b'using JulOS.Infrastructure.Agents;\r\nusing JulOS.Infrastructure.Health;\r\n')
          replace_if_missing(
              'src/JulOS.Server/Program.cs',
              b'using JulOS.Server.Agents;',
              b'using JulOS.Server.Auditing;\r\n',
              b'using JulOS.Server.Agents;\r\nusing JulOS.Server.Auditing;\r\n')
          replace_if_missing(
              'src/JulOS.Server/Program.cs',
              b'AddJulOsAgentControl();',
              b'builder.Services.AddJulOsCorePersistence(coreDatabase);\r\n',
              b'builder.Services.AddJulOsCorePersistence(coreDatabase);\r\nbuilder.Services.AddJulOsAgentControl();\r\n')
          replace_if_missing(
              'src/JulOS.Server/Program.cs',
              b'MapJulOsAgents();',
              b'app.MapJulOsAudit();\r\n',
              b'app.MapJulOsAudit();\r\napp.MapJulOsAgents();\r\n')

          replace_if_missing(
              'src/JulOS.Server/Errors/ProblemDetailsCustomizer.cs',
              b'using JulOS.Application.Agents;',
              b'using JulOS.Application.Authentication;\r\n',
              b'using JulOS.Application.Agents;\r\nusing JulOS.Application.Authentication;\r\n')
          replace_if_missing(
              'src/JulOS.Server/Errors/ProblemDetailsCustomizer.cs',
              b'exception is AgentControlException agentFailure',
              b'        else if (exception is AuthenticationFailureException authenticationFailure)\r\n',
              b'        else if (exception is AgentControlException agentFailure)\r\n        {\r\n            context.ProblemDetails.Detail = agentFailure.Message;\r\n        }\r\n        else if (exception is AuthenticationFailureException authenticationFailure)\r\n')
          problem = Path('src/JulOS.Server/Errors/ProblemDetailsCustomizer.cs')
          pdata = problem.read_bytes()
          classify_marker = b'            return (agentFailure.Code, false);'
          if classify_marker not in pdata:
              anchor = b'        if (exception is AuthenticationFailureException authenticationFailure)\r\n'
              pdata = pdata.replace(
                  anchor,
                  b'        if (exception is AgentControlException agentFailure)\r\n        {\r\n            return (agentFailure.Code, false);\r\n        }\r\n\r\n' + anchor,
                  1)
              problem.write_bytes(pdata)

          agent_program = Path('src/JulOS.Agent/Program.cs')
          if b'new AgentClient' not in agent_program.read_bytes():
              agent_program.write_bytes('''﻿using System.Collections;\r
\r
using JulOS.Agent;\r
\r
var environment = Environment.GetEnvironmentVariables()\r
    .Cast<DictionaryEntry>()\r
    .ToDictionary(\r
        entry => Convert.ToString(entry.Key, System.Globalization.CultureInfo.InvariantCulture) ?? string.Empty,\r
        entry => Convert.ToString(entry.Value, System.Globalization.CultureInfo.InvariantCulture),\r
        StringComparer.Ordinal);\r
var options = AgentOptions.Read(environment);\r
var timeProvider = TimeProvider.System;\r
using var httpClient = new HttpClient\r
{\r
    BaseAddress = options.ServerEndpoint,\r
    Timeout = TimeSpan.FromSeconds(30),\r
};\r
var collector = new LinuxMetricsCollector(timeProvider);\r
var executor = new AgentCommandExecutor(timeProvider, options.Version);\r
var agent = new AgentClient(httpClient, options, collector, executor, timeProvider);\r
using var shutdown = new CancellationTokenSource();\r
Console.CancelKeyPress += (_, eventArgs) =>\r
{\r
    eventArgs.Cancel = true;\r
    shutdown.Cancel();\r
};\r
\r
while (!shutdown.IsCancellationRequested)\r
{\r
    try\r
    {\r
        await agent.RunAsync(shutdown.Token).ConfigureAwait(false);\r
    }\r
    catch (OperationCanceledException) when (shutdown.IsCancellationRequested)\r
    {\r
        break;\r
    }\r
    catch (HttpRequestException exception)\r
    {\r
        Console.Error.WriteLine($"Agent connection failed with HTTP status {exception.StatusCode?.ToString() ?? "unavailable"}.");\r
        try\r
        {\r
            await Task.Delay(TimeSpan.FromSeconds(5), timeProvider, shutdown.Token).ConfigureAwait(false);\r
        }\r
        catch (OperationCanceledException) when (shutdown.IsCancellationRequested)\r
        {\r
            break;\r
        }\r
    }\r
}\r
'''.encode('utf-8'))

          replace_if_missing(
              'JulOS.slnx',
              b'tests/JulOS.Agent.Tests/JulOS.Agent.Tests.csproj',
              b'    <Project Path="tests/JulOS.Architecture.Tests/JulOS.Architecture.Tests.csproj" />\r\n',
              b'    <Project Path="tests/JulOS.Agent.Tests/JulOS.Agent.Tests.csproj" />\r\n    <Project Path="tests/JulOS.Architecture.Tests/JulOS.Architecture.Tests.csproj" />\r\n')
          replace_if_missing(
              'tests/JulOS.Architecture.Tests/ProjectReferenceTests.cs',
              b'tests/JulOS.Agent.Tests/JulOS.Agent.Tests.csproj',
              b'        [PlatformProjects.ArchitectureTests] = [],\r\n',
              b'        [PlatformProjects.ArchitectureTests] = [],\r\n        ["tests/JulOS.Agent.Tests/JulOS.Agent.Tests.csproj"] = [PlatformProjects.Agent],\r\n')
          PY

          node tools/normalize-encoding.mjs

      - name: Remove temporary workflows and commit
        run: |
          rm -f .github/desktop-error.txt .github/desktop-status.txt
          git rm -f --ignore-unmatch \
            .github/workflows/desktop-diagnostics.yml \
            .github/workflows/desktop-fix-and-clean.yml \
            .github/workflows/wire-agent-server.yml \
            .github/workflows/build-agent-daemon.yml \
            .github/workflows/add-agent-tests.yml \
            .github/workflows/harden-agent-block.yml \
            .github/workflows/consolidate-agent-phase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Consolidate Agent phase"
          git pull --rebase origin agent/complete-julos-work-breakdown
          git push origin HEAD:agent/complete-julos-work-breakdown
