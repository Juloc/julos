name: Agent API-008 validation v4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-api008-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/complete-julos-work-breakdown'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      - name: Apply verified source and compiler corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/agent-api008.yml').read_text().splitlines()
          for output, name in [
              ('/tmp/api008-apply.sh', 'Apply verified API-008 source'),
              ('/tmp/api008-migrate.sh', 'Generate the secret-reference migration'),
          ]:
              marker = f'      - name: {name}'
              start = lines.index(marker)
              run = next(i for i in range(start, len(lines)) if lines[i] == '        run: |')
              end = next(
                  (i for i in range(run + 1, len(lines)) if lines[i].startswith('      - name:')),
                  len(lines))
              body = '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in lines[run + 1:end])
              Path(output).write_text('set -euo pipefail\n' + body + '\n', encoding='utf-8')
          PY
          bash /tmp/api008-apply.sh

          python3 - <<'PY'
          from pathlib import Path
          import re

          service = Path('src/JulOS.Application/Secrets/SecretReferenceService.cs')
          text = service.read_text(encoding='utf-8-sig')
          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)if \(currentState == DisposedState\)\n'
              r'(?P=indent)\{\n'
              r'(?P=indent)    throw new ObjectDisposedException\(nameof\(SecretLease\)\);\n'
              r'(?P=indent)\}')
          text, count = pattern.subn(
              lambda match: (
                  f"{match.group('indent')}"
                  'ObjectDisposedException.ThrowIf(currentState == DisposedState, this);'),
              text,
              count=1)
          if count != 1:
              raise SystemExit('The SecretLease disposed-state block was not found exactly once.')
          service.write_text('\ufeff' + text, encoding='utf-8')

          tests = Path('tests/JulOS.Integration.Tests/Secrets/SecretReferenceTests.cs')
          text = tests.read_text(encoding='utf-8-sig')
          anchor = 'using Microsoft.AspNetCore.Antiforgery;\n'
          addition = anchor + 'using Microsoft.AspNetCore.Http;\n'
          if 'using Microsoft.AspNetCore.Http;\n' not in text:
              if anchor not in text:
                  raise SystemExit('The ASP.NET Core using anchor was not found.')
              text = text.replace(anchor, addition, 1)
          tests.write_text('\ufeff' + text, encoding='utf-8')
          PY
          node tools/normalize-encoding.mjs

      - name: Compile the corrected secret-reference service
        run: |
          dotnet restore JulOS.slnx
          dotnet build JulOS.slnx --no-restore

      - name: Generate the secret-reference migration
        shell: bash
        run: bash /tmp/api008-migrate.sh

      - name: Run full repository validation
        run: sh tools/validate.sh

      - name: Commit validated API-008 result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent .agent-diagnostic
          rm -f \
            .github/workflows/agent-api008.yml \
            .github/workflows/agent-api008-v2.yml \
            .github/workflows/agent-api008-v3.yml \
            .github/workflows/agent-api008-v4.yml \
            .github/workflows/agent-source-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete API-008 secret-reference service"
          git push origin HEAD:${{ github.head_ref }}
