name: Publish session runtimes

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-session-runtimes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish session runtime images
    if: github.repository == 'Juloc/julos'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
            echo "VERSION must contain a JulOS prerelease version, got: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing immutable runtime tags
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          for image in \
            "ghcr.io/juloc/julos-runtime-manager:$version" \
            "ghcr.io/juloc/julos-remote-provider:$version"; do
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Runtime image version already exists: $image" >&2
              exit 1
            fi
          done

      - name: Build and publish Runtime Manager
        id: manager
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/JulOS.RuntimeManager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/juloc/julos-runtime-manager:${{ steps.version.outputs.value }}
          build-args: |
            JULOS_VERSION=${{ steps.version.outputs.value }}
          provenance: false
          sbom: true

      - name: Attest Runtime Manager provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/juloc/julos-runtime-manager
          subject-digest: ${{ steps.manager.outputs.digest }}
          push-to-registry: true

      - name: Build and publish Remote provider
        id: provider
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/JulOS.Remote/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/juloc/julos-remote-provider:${{ steps.version.outputs.value }}
          build-args: |
            JULOS_VERSION=${{ steps.version.outputs.value }}
          provenance: false
          sbom: true

      - name: Attest Remote provider provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/juloc/julos-remote-provider
          subject-digest: ${{ steps.provider.outputs.digest }}
          push-to-registry: true

      - name: Publish immutable runtime references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-references
          printf '%s@%s\n' 'ghcr.io/juloc/julos-runtime-manager' '${{ steps.manager.outputs.digest }}' > runtime-references/runtime-manager.txt
          printf '%s@%s\n' 'ghcr.io/juloc/julos-remote-provider' '${{ steps.provider.outputs.digest }}' > runtime-references/remote-provider.txt

      - name: Upload runtime references
        uses: actions/upload-artifact@v7
        with:
          name: JulOS-session-runtimes-${{ steps.version.outputs.value }}-${{ github.sha }}
          path: runtime-references/
          if-no-files-found: error
          retention-days: 90
