name: Complete REM-005 display transport slice

on:
  push:
    branches:
      - agent/rem-005-display-transport
    paths:
      - .github/workflows/complete-rem-005-display-transport.yml

permissions:
  contents: write

concurrency:
  group: complete-rem-005-display-transport
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'Juloc/julos'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-005-display-transport
          persist-credentials: true

      - name: Apply product, tests and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json

          payloads = json.loads(r"""{"src/JulOS.Infrastructure/Remote/RemoteDisplayGateway.cs":"","src/JulOS.Infrastructure/Remote/PostgresRemoteDisplayAuthorizationService.cs":"","src/JulOS.Server/Remote/RemoteDisplayEndpoints.cs":"","tests/JulOS.Infrastructure.Tests/Remote/RemoteDisplayGatewayTests.cs":" dXJhdGlvbik7CiAgICB9Cn0K","tests/JulOS.Integration.Tests/Remote/RemoteDisplayEndpointTests.cs":""} )
          for relative, payload in payloads.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(payload))

          def replace_one(relative, old, new):
              path = Path(relative)
              text = path.read_text(encoding="utf-8-sig")
              if text.count(old) != 1:
                  raise RuntimeError(f"Expected one anchor in {relative}: {old[:80]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace_one(
              "src/JulOS.Server/Program.cs",
              'app.UseRateLimiter();\napp.UseAuthentication();\n',
              'app.UseRateLimiter();\napp.UseWebSockets();\napp.UseAuthentication();\n')
          replace_one(
              "src/JulOS.Server/Program.cs",
              'app.MapJulOsRealtimeEvents();\napp.MapJulOsRemoteProviderEvents();\n\napp.MapGet(\n',
              'app.MapJulOsRealtimeEvents();\napp.MapJulOsRemoteProviderEvents();\napp.MapJulOsRemoteDisplay();\n\napp.MapGet(\n')
          replace_one(
              "tests/JulOS.Integration.Tests/Remote/RemoteSessionResumeTests.cs",
              'using JulOS.Infrastructure.Persistence.Core;\nusing JulOS.Integration.Tests.Persistence;\n',
              'using JulOS.Infrastructure.Persistence.Core;\nusing JulOS.Infrastructure.Remote;\nusing JulOS.Integration.Tests.Persistence;\n')
          replace_one(
              "tests/JulOS.Integration.Tests/Remote/RemoteSessionResumeTests.cs",
              "public async Task ActiveResumeClearsDisplayAndKeepsRuntimeAndActivity()",
              "public async Task ActiveResumeIssuesFreshTokenFreeDisplayAndKeepsRuntimeAndActivity()")
          replace_one(
              "tests/JulOS.Integration.Tests/Remote/RemoteSessionResumeTests.cs",
              '        Assert.AreEqual(RemoteSessionStates.Connected, resumed.State);\n        Assert.AreEqual(connected.Revision + 1, resumed.Revision);\n        Assert.IsNull(resumed.Display);\n        Assert.AreEqual(0, runtime.RemovalCount);\n        Assert.AreEqual(runtimeId, row.RuntimeId);\n        Assert.AreEqual(lastActivity, row.LastActivityAtUtc);\n        Assert.AreEqual(clock.GetUtcNow(), row.UpdatedAtUtc);\n',
              '        Assert.AreEqual(RemoteSessionStates.Connected, resumed.State);\n        Assert.AreEqual(connected.Revision + 1, resumed.Revision);\n        Assert.IsNotNull(resumed.Display);\n        Assert.AreEqual(RemoteDisplayGateway.DisplayKind, resumed.Display.Kind);\n        Assert.AreEqual(RemoteDisplayGateway.ContractVersion, resumed.Display.ContractVersion);\n        Assert.AreEqual(clock.GetUtcNow().AddSeconds(60), resumed.Display.ExpiresAtUtc);\n        Assert.IsTrue(resumed.Display.Endpoint.Contains(\n            $"package={CallerPackageId}",\n            StringComparison.Ordinal));\n        Assert.IsTrue(resumed.Display.Endpoint.Contains(\n            $"revision={resumed.Revision}",\n            StringComparison.Ordinal));\n        Assert.IsFalse(resumed.Display.Endpoint.Contains(\n            "token",\n            StringComparison.OrdinalIgnoreCase));\n        Assert.AreEqual(resumed.Display.Endpoint, row.DisplayEndpoint);\n        Assert.AreEqual(resumed.Display.ExpiresAtUtc, row.DisplayExpiresAtUtc);\n        Assert.AreEqual(0, runtime.RemovalCount);\n        Assert.AreEqual(runtimeId, row.RuntimeId);\n        Assert.AreEqual(lastActivity, row.LastActivityAtUtc);\n        Assert.AreEqual(clock.GetUtcNow(), row.UpdatedAtUtc);\n')
          replace_one(
              "tests/JulOS.Integration.Tests/Remote/RemoteSessionResumeTests.cs",
              '            ["Remote:Providers:0:PidsLimit"] = "128",\n            ["Remote:NetworkProfiles:0:NetworkProfileId"] = networkProfileId.ToString("D"),\n',
              '            ["Remote:Providers:0:PidsLimit"] = "128",\n            ["Remote:Display:ProviderEndpointTemplate"] = "ws://127.0.0.1:9/runtime/{runtimeId}",\n            ["Remote:Display:PublicOrigin"] = "https://localhost",\n            ["Remote:Display:GrantLifetimeSeconds"] = "60",\n            ["Remote:NetworkProfiles:0:NetworkProfileId"] = networkProfileId.ToString("D"),\n')
          replace_one(
              "deploy/compose/compose.yaml",
              '    Secrets__LeaseLifetimeSeconds: 300\n  volumes:\n',
              '    Secrets__LeaseLifetimeSeconds: 300\n    Remote__Display__ProviderEndpointTemplate: ${JULOS_REMOTE_DISPLAY_PROVIDER_ENDPOINT_TEMPLATE:-}\n    Remote__Display__PublicOrigin: ${JULOS_REMOTE_DISPLAY_PUBLIC_ORIGIN:-}\n    Remote__Display__GrantLifetimeSeconds: ${JULOS_REMOTE_DISPLAY_GRANT_LIFETIME_SECONDS:-60}\n  volumes:\n')
          replace_one(
              "deploy/compose/.env.example",
              'JULOS_SERVER_PORT=8080\n',
              'JULOS_SERVER_PORT=8080\n\n# Optional Remote display transport. Set both values together to enable it.\n# The provider template must contain exactly one {runtimeId} placeholder.\nJULOS_REMOTE_DISPLAY_PROVIDER_ENDPOINT_TEMPLATE=\nJULOS_REMOTE_DISPLAY_PUBLIC_ORIGIN=\nJULOS_REMOTE_DISPLAY_GRANT_LIFETIME_SECONDS=60\n')
          replace_one(
              "docs/BACKLOG.md",
              '| REM-004 | Remote worker and session orchestration | Done | Exact-idempotent ownership, policy-gated runtimes, authenticated provider events, lifecycle enforcement, cleanup, explicit detach and active-session resume authorization are implemented and validated. |\n| Phase 6 | Remote and Browser | In progress | REM-001 through REM-004 are complete; REM-005 functional display transport and client is next. Existing package shells are not complete display implementations. |\n',
              '| REM-004 | Remote worker and session orchestration | Done | Exact-idempotent ownership, policy-gated runtimes, authenticated provider events, lifecycle enforcement, cleanup, explicit detach and active-session resume authorization are implemented and validated. |\n| REM-005 | Functional Remote display client and same-origin transport | In progress | Token-free graphical descriptors, exact durable authorization and the same-origin WebSocket proxy are implemented in PR #38; package rendering and input remain. |\n| Phase 6 | Remote and Browser | In progress | REM-001 through REM-004 are complete; REM-005 transport is in progress and its package display/input client remains. Existing package shells are not complete display implementations. |\n')
          replace_one(
              "docs/BACKLOG.md",
              'The functional same-origin display data path, resizing, input, full-screen client and transport-specific presentation behavior belong to REM-005. REM-004 does not add a placeholder display endpoint.\n',
              'REM-005 now begins with a token-free graphical descriptor and one authenticated same-origin WebSocket proxy. The server validates the configured public Origin, authenticated user, caller package selector, active durable session, exact revision, exact stored endpoint and descriptor expiry before resolving the hidden provider endpoint. Stale, expired, detached and terminal presentation state is rejected. Package rendering, resizing, input, full-screen and touch behavior remain in the next REM-005 slices.\n')
          replace_one(
              "docs/REMOTE-SESSION-CONTRACT.md",
              'It contains no access token. Authentication is performed by the JulOS same-origin session and later transport-specific authorization.\n',
              'It contains no access token. The relative endpoint may carry non-secret package, revision and expiry selectors, but no bearer credential or provider address. Every browser connection is authenticated by the JulOS login cookie and authorized against the configured public Origin, authenticated user, caller package selector, active durable session, exact revision, exact stored descriptor and expiry before the hidden provider endpoint is resolved.\n')
          PY
          node tools/normalize-encoding.mjs
          git diff --check

      - name: Commit completed transport slice
        shell: bash
        run: |
          set -euo pipefail
          git add src tests docs deploy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(remote): complete token-free display transport'
          git push origin HEAD:agent/rem-005-display-transport
