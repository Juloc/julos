# One-shot PR trigger for the branch-local REM-004 source patch. Removed by its own commit.
name: Trigger REM-004 source patch

on:
  pull_request:
    paths:
      - .github/workflows/trigger-rem-004-apply.yml

permissions:
  contents: write

concurrency:
  group: trigger-rem-004-source-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'Juloc/julos' && github.head_ref == 'agent/rem-004-runtime-allocation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-004-runtime-allocation
          persist-credentials: true
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/apply-rem-004-runtime.yml
          sed -n "/<<'PATCH'/,/^PATCH$/p" "$workflow" | sed '1d;$d' > "$RUNNER_TEMP/rem004.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/rem004.patch.gz.b64" > "$RUNNER_TEMP/rem004.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/rem004.patch.gz" > "$RUNNER_TEMP/rem004.patch"
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/rem004.patch"
          git rm .github/workflows/apply-rem-004-runtime.yml
          git rm .github/workflows/trigger-rem-004-apply.yml
          git rm .github/workflows/export-rem-004-source.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(remote): allocate allowlisted provider runtimes'
          git push origin HEAD:agent/rem-004-runtime-allocation
