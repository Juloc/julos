name: One-shot REM-004 cleanup retry fix

on:
  push:
    branches:
      - agent/rem-004-lifecycle-cleanup
    paths:
      - .github/workflows/one-shot-rem004-retry-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rem-004-lifecycle-cleanup
          fetch-depth: 0
      - name: Patch cleanup retry
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/JulOS.Infrastructure/Remote/PostgresRemoteSessionLifecycleService.cs")
          text = path.read_text(encoding="utf-8-sig")
          text = text.replace(
              "                row.RuntimeId != null && (row.State == RemoteSessionStates.Disconnected\n",
              "                row.RuntimeId != null && (row.State == RemoteSessionStates.Disconnecting\n                    || row.State == RemoteSessionStates.Disconnected\n")
          old = """            if (await this.TryCleanupRuntimeAsync(row, cancellationToken).ConfigureAwait(false))\n            {\n                cleaned++;\n            }\n            else\n            {\n                failures++;\n            }\n"""
          new = """            if (!await this.TryCleanupRuntimeAsync(row, cancellationToken).ConfigureAwait(false))\n            {\n                failures++;\n                continue;\n            }\n\n            cleaned++;\n            if (string.Equals(row.State, RemoteSessionStates.Disconnecting, StringComparison.Ordinal))\n            {\n                Transition(row, RemoteSessionStates.Disconnected, now);\n                row.EndedAtUtc = now;\n                await this.SaveAsync(cancellationToken).ConfigureAwait(false);\n                await this.PublishChangedAsync(row, cancellationToken).ConfigureAwait(false);\n            }\n"""
          if old not in text:
              raise SystemExit("Expected cleanup result block not found")
          path.write_text(text.replace(old, new), encoding="utf-8-sig")
          Path(".github/workflows/one-shot-rem004-retry-fix.yml").unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(remote): finish disconnect after cleanup retry"
          git push origin HEAD:agent/rem-004-lifecycle-cleanup
