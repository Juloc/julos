name: Harden Agent implementation

on:
  push:
    branches:
      - agent/complete-julos-work-breakdown

permissions:
  contents: write

concurrency:
  group: harden-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0

      - name: Apply analyzer-safe Agent fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              file = Path(path)
              data = file.read_bytes()
              for old, new in replacements:
                  if old not in data:
                      raise SystemExit(f'missing expected text in {path}: {old!r}')
                  data = data.replace(old, new, 1)
              file.write_bytes(data)

          patch('src/JulOS.Server/Agents/AgentEndpoints.cs', [
              (b'using System.Globalization;\r\n', b''),
              (b'using System.Text.Json;\r\n', b''),
              (b'Guid.TryParseExact(httpContext.Request.Headers[AgentIdHeader], "D", out var agentId)',
               b'Guid.TryParseExact(httpContext.Request.Headers[AgentIdHeader].ToString(), "D", out var agentId)'),
              (b'            var command = await service.AcquireNextCommandAsync(\r\n                RequireAgentId(context),\r\n                cancellationToken).ConfigureAwait(false);\r\n            return command is null ? TypedResults.NoContent() : TypedResults.Ok(command);',
               b'            var command = await service.AcquireNextCommandAsync(\r\n                RequireAgentId(context),\r\n                cancellationToken).ConfigureAwait(false);\r\n            if (command is null)\r\n            {\r\n                return TypedResults.NoContent();\r\n            }\r\n\r\n            return TypedResults.Ok(command);'),
          ])

          patch('src/JulOS.Agent/LinuxMetricsCollector.cs', [
              (b'        catch (UnauthorizedAccessException)\r\n        {\r\n            return new DiskSample(null, null);\r\n        }',
               b'        catch (UnauthorizedAccessException)\r\n        {\r\n            return new DiskSample(null, null);\r\n        }\r\n        catch (ArgumentException)\r\n        {\r\n            return new DiskSample(null, null);\r\n        }'),
          ])

          patch('tests/JulOS.Agent.Tests/LinuxMetricsCollectorTests.cs', [
              (b'        Assert.AreEqual(0.5d, cpu.Value, 0.0001d);',
               b'        Assert.IsNotNull(cpu.Value);\r\n        Assert.AreEqual(0.5d, cpu.Value.Value, 0.0001d);'),
          ])
          PY

      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-agent-block.yml
          git add src/JulOS.Agent src/JulOS.Server/Agents tests/JulOS.Agent.Tests
          git commit -m "Harden Agent implementation"
          git push origin HEAD:agent/complete-julos-work-breakdown
