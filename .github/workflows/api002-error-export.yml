name: API-002 error export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    if: github.head_ref == 'agent/complete-julos-work-breakdown' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json
      - run: dotnet tool restore
      - name: Export concise validation errors
        shell: bash
        run: |
          set +e
          sh tools/validate.sh > /tmp/validation.log 2>&1
          code=$?
          mkdir -p .tmp
          {
            echo "exit=$code"
            grep -nE 'error |error:|FAILED|failed|CS[0-9]{4}|CA[0-9]{4}|Stage' /tmp/validation.log | tail -n 200
          } > .tmp/api002-errors.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/api002-errors.txt
          git commit -m "Export API-002 validation errors"
          git push origin HEAD:agent/complete-julos-work-breakdown
