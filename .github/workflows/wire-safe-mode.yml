name: Wire server safe mode

on:
  push:
    branches:
      - agent/complete-julos-work-breakdown

permissions:
  contents: write

concurrency:
  group: wire-safe-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0

      - name: Enforce safe mode in Server and Package API
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_if_missing(path, marker, old, new):
              file = Path(path)
              data = file.read_bytes()
              if marker in data:
                  return
              if old not in data:
                  raise SystemExit(f'missing anchor in {path}: {old!r}')
              file.write_bytes(data.replace(old, new, 1))

          replace_if_missing(
              'src/JulOS.Server/Program.cs',
              b'using JulOS.Server.System;',
              b'using JulOS.Server.Secrets;\r\n',
              b'using JulOS.Server.Secrets;\r\nusing JulOS.Server.System;\r\n')
          replace_if_missing(
              'src/JulOS.Server/Program.cs',
              b'SafeModeState.Read',
              b'builder.Services.AddJulOsAuthorization();\r\n',
              b'builder.Services.AddJulOsAuthorization();\r\nbuilder.Services.AddSingleton(SafeModeState.Read(builder.Configuration));\r\n')
          replace_if_missing(
              'src/JulOS.Server/Program.cs',
              b'MapJulOsSafeMode();',
              b'app.MapJulOsSecretReferences();\r\n',
              b'app.MapJulOsSecretReferences();\r\napp.MapJulOsSafeMode();\r\n')

          package = Path('src/JulOS.Server/Packages/PackageEndpoints.cs')
          data = package.read_bytes()
          if b'using JulOS.Server.System;' not in data:
              anchor = b'using JulOS.Server.Authorization;\r\n'
              data = data.replace(anchor, anchor + b'using JulOS.Server.System;\r\n', 1)
          signature = b'        IAntiforgery antiforgery,\r\n        IPackageManagementService service,\r\n        CancellationToken cancellationToken)\r\n    {\r\n        await JulOsAntiforgery.ValidateAsync(context, antiforgery).ConfigureAwait(false);\r\n        try\r\n        {\r\n            return TypedResults.Ok(ToResponse(await service.EnableAsync('
          replacement = b'        IAntiforgery antiforgery,\r\n        IPackageManagementService service,\r\n        SafeModeState safeMode,\r\n        CancellationToken cancellationToken)\r\n    {\r\n        await JulOsAntiforgery.ValidateAsync(context, antiforgery).ConfigureAwait(false);\r\n        if (safeMode.Enabled)\r\n        {\r\n            return Results.Conflict(new\r\n            {\r\n                code = "package.safe_mode",\r\n                detail = "Optional packages cannot be enabled while JulOS is in safe mode.",\r\n            });\r\n        }\r\n\r\n        try\r\n        {\r\n            return TypedResults.Ok(ToResponse(await service.EnableAsync('
          if b'Optional packages cannot be enabled while JulOS is in safe mode.' not in data:
              if signature not in data:
                  raise SystemExit('Package enable endpoint anchor is missing.')
              data = data.replace(signature, replacement, 1)
          package.write_bytes(data)
          PY
          node tools/normalize-encoding.mjs

      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-safe-mode.yml
          git add src/JulOS.Server
          git commit -m "Enforce server safe mode"
          git pull --rebase origin agent/complete-julos-work-breakdown
          git push origin HEAD:agent/complete-julos-work-breakdown
