name: Agent API-008 validation v5

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-api008-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/complete-julos-work-breakdown'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      - name: Apply corrected API-008 source and policies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/agent-api008-v4.yml').read_text().splitlines()
          marker = '      - name: Apply verified source and compiler corrections'
          start = lines.index(marker)
          run = next(i for i in range(start, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run + 1, len(lines)) if lines[i].startswith('      - name:'))
          body = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[run + 1:end])
          Path('/tmp/api008-prepare.sh').write_text(
              'set -euo pipefail\n' + body + '\n', encoding='utf-8')
          PY
          bash /tmp/api008-prepare.sh

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/JulOS.Server/Authorization/AuthorizationServices.cs')
          text = path.read_text(encoding='utf-8-sig')
          if 'JulOsAuthorizationPolicies.SecretManage,' not in text:
              pattern = re.compile(
                  r'(?m)^(?P<indent>[ \t]*)AddPermissionPolicy\(\s*'
                  r'options,\s*'
                  r'JulOsAuthorizationPolicies\.OperationCancel,\s*'
                  r'AuthorizationPermissionNames\.OperationCancel\);')

              def add_secret_policies(match):
                  indent = match.group('indent')
                  continuation = indent + '  '
                  return match.group(0) + '\n' + (
                      f'{indent}AddPermissionPolicy(\n'
                      f'{continuation}options,\n'
                      f'{continuation}JulOsAuthorizationPolicies.SecretRead,\n'
                      f'{continuation}AuthorizationPermissionNames.SecretRead);\n'
                      f'{indent}AddPermissionPolicy(\n'
                      f'{continuation}options,\n'
                      f'{continuation}JulOsAuthorizationPolicies.SecretManage,\n'
                      f'{continuation}AuthorizationPermissionNames.SecretManage);')

              text, count = pattern.subn(add_secret_policies, text, count=1)
              if count != 1:
                  raise SystemExit('The operation-cancel policy registration was not found exactly once.')
          path.write_text('\ufeff' + text, encoding='utf-8')
          PY
          node tools/normalize-encoding.mjs

      - name: Compile the corrected secret-reference service
        run: |
          dotnet restore JulOS.slnx
          dotnet build JulOS.slnx --no-restore

      - name: Generate the secret-reference migration
        shell: bash
        run: bash /tmp/api008-migrate.sh

      - name: Run full repository validation
        shell: bash
        run: |
          set +e
          sh tools/validate.sh > /tmp/api008-validation.log 2>&1
          status=$?
          set -e
          cat /tmp/api008-validation.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          mkdir -p .agent-diagnostic
          grep -E -B 30 -A 180 \
            'failed|Assertion failed|Exception|PostgresException|Validation stage|error (CS|CA|IDE|NETSDK)[0-9]+|Error:' \
            /tmp/api008-validation.log | tail -n 1000 \
            > .agent-diagnostic/api008-validation.txt || true
          test -s .agent-diagnostic/api008-validation.txt \
            || tail -n 800 /tmp/api008-validation.log \
              > .agent-diagnostic/api008-validation.txt
          node tools/normalize-encoding.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-diagnostic/api008-validation.txt
          git commit -m 'Record API-008 validation failure after policy fix' || true
          git push origin HEAD:${{ github.head_ref }}
          exit "$status"

      - name: Commit validated API-008 result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent .agent-diagnostic
          rm -f \
            .github/workflows/agent-api008.yml \
            .github/workflows/agent-api008-v2.yml \
            .github/workflows/agent-api008-v3.yml \
            .github/workflows/agent-api008-v4.yml \
            .github/workflows/agent-api008-v5.yml \
            .github/workflows/agent-api008-diagnostic.yml \
            .github/workflows/agent-source-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete API-008 secret-reference service"
          git push origin HEAD:${{ github.head_ref }}
