name: API-002 docs finalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/complete-julos-work-breakdown' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
      - name: Rebuild final API-002 commit with documentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary 1bc2c4edf4e290f555c41e0b792c332f860e1dc7 HEAD -- \
            . \
            ':(exclude).github/workflows/api002-*' \
            ':(exclude).tmp/**' \
            > /tmp/api002.patch
          git reset --hard 1bc2c4edf4e290f555c41e0b792c332f860e1dc7
          git apply /tmp/api002.patch

          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(rel):
              return Path(rel).read_text(encoding='utf-8-sig').replace('\r\n', '\n')

          def write(rel, text):
              Path(rel).write_bytes(b'\xef\xbb\xbf' + text.rstrip().replace('\n', '\r\n').encode('utf-8') + b'\r\n')

          rel = 'docs/BACKLOG.md'
          text = read(rel)
          if '| API-002 | Optimistic concurrency | Done |' not in text:
              api001_line = next(line for line in text.splitlines() if line.startswith('| API-001 |'))
              text = text.replace(
                  api001_line + '\n',
                  api001_line + '\n'
                  '| API-002 | Optimistic concurrency | Done | EF Core revision conflicts are translated centrally; HTTP 409 returns the current revision and PostgreSQL tests prevent silent last-write-wins. |\n',
                  1,
              )
          text = re.sub(
              r'(\| Phase 2 \| Persistence, authentication and core APIs \| In progress \|)[^\n]*(\|)',
              r'\1 `API-001` and `API-002` are done; local authentication is next. \2',
              text,
              count=1,
          )
          next_section = '''## Next issue

          ### API-003 — Add local authentication

          Scope:

          - first-run administrator setup
          - local login and logout
          - secure cookie sessions
          - lockout, rate limiting and session timeout

          Acceptance:

          - Desktop and APIs reject unauthenticated users
          - login rate limiting and lockout are covered by integration tests

          '''.replace('          ', '')
          text, count = re.subn(
              r'## Next issue\n.*?(?=## Specification status)',
              next_section,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('BACKLOG next-issue section not found')
          write(rel, text)

          rel = 'docs/WORK_BREAKDOWN.md'
          text = read(rel)
          start = text.index('### API-002 — Add optimistic concurrency')
          end = text.index('### API-003 — Add local authentication', start)
          section = text[start:end]
          if 'Status: done.' not in section:
              section = section.replace(
                  '### API-002 — Add optimistic concurrency\n\n',
                  '### API-002 — Add optimistic concurrency\n\nStatus: done.\n\n',
                  1,
              )
          implementation = '''
          Implemented in `CoreDbContext`, `ConcurrencyConflictException` and the shared Problem Details pipeline. Every mapped `Revision` remains an EF Core concurrency token. A zero-row update is translated once at the persistence boundary; callers receive HTTP 409 with `request.concurrency_conflict` and `currentRevision` when the row still exists. A deleted row has no current revision, and no automatic retry is attempted because the intended mutation must be reconsidered against authoritative state.

          PostgreSQL integration tests use two real contexts against the same row. The first writer advances the revision; the stale writer is rejected and the stored state is verified unchanged. A server-host test covers the public 409 response shape.

          '''.replace('          ', '')
          if 'Implemented in `CoreDbContext`' not in section:
              section = section.rstrip() + '\n' + implementation
          text = text[:start] + section + text[end:]
          write(rel, text)

          rel = 'docs/DATA_AND_API_CONTRACTS.md'
          text = read(rel)
          if '`currentRevision`' not in text:
              marker = '- `retryAfterSeconds` when the server can provide one\n'
              if marker not in text:
                  raise SystemExit('Problem Details extension list not found')
              text = text.replace(
                  marker,
                  marker + '- `currentRevision` for an optimistic-concurrency conflict when the resource still exists\n',
                  1,
              )
          note = '''
          ### Optimistic-concurrency conflict

          A stale mutation returns HTTP 409 with code `request.concurrency_conflict`. `currentRevision` contains the authoritative stored revision when the row still exists; it is omitted when another writer deleted the row. The response is not marked retryable. Clients must refresh the resource, re-evaluate the intended mutation and submit a new request with the refreshed revision rather than replaying the stale request automatically.
          '''.replace('          ', '')
          if '### Optimistic-concurrency conflict' not in text:
              anchor = '## Event envelope'
              if anchor not in text:
                  raise SystemExit('Event envelope anchor not found')
              text = text.replace(anchor, note + '\n\n' + anchor, 1)
          write(rel, text)

          rel = 'docs/TECHNICAL_SPECIFICATION.md'
          text = read(rel)
          note = '''
          ### Persistence concurrency boundary

          `CoreDbContext` is the single translation boundary for EF Core concurrency failures. Infrastructure reads the current database revision after a failed update and raises the transport-neutral `ConcurrencyConflictException`; Server converts that exception to the versioned Problem Details contract. Application and package code do not depend on EF Core exception types, and no layer automatically retries a rejected mutation.
          '''.replace('          ', '')
          if '### Persistence concurrency boundary' not in text:
              anchor = '## API surface'
              text = text.replace(anchor, note + '\n\n' + anchor, 1) if anchor in text else text.rstrip() + '\n\n' + note
          write(rel, text)

          rel = 'docs/DECISIONS.md'
          text = read(rel)
          decision = '''
          ## D027 — Translate stale writes once and never retry them automatically

          **Decision:** `CoreDbContext` translates `DbUpdateConcurrencyException` into a transport-neutral application conflict carrying the current stored revision when available. Server returns HTTP 409 and clients refresh authoritative state before constructing a new mutation. JulOS does not automatically replay a stale write.

          **Reason:** EF Core types must not escape Infrastructure, all mutation paths require one consistent public contract, and replaying the original request could overwrite a decision made by another user or background operation.

          **Consequence:** every revision-controlled row uses the shared mapping and translation path. A deleted row produces a conflict without `currentRevision`; callers still refresh instead of treating deletion as a retryable transient failure.
          '''.replace('          ', '')
          if '## D027 — Translate stale writes once' not in text:
              text = text.rstrip() + '\n\n' + decision
          write(rel, text)
          PY

          node tools/normalize-encoding.mjs
          node tools/validate.mjs --stage policy --stage markdown-links
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "API-002: add optimistic concurrency handling" \
            -m "Scope: translate EF Core concurrency failures centrally, return HTTP 409 with the current revision, prove that stale writes cannot overwrite newer state, and synchronize the authoritative documentation." \
            -m "Out of scope: authentication, authorization policies, profile settings endpoints and automatic retry behavior." \
            -m "Validation: source and documentation files were normalized and policy, link and diff checks passed before commit; full repository validation follows on the clean branch state."
          git push --force origin HEAD:agent/complete-julos-work-breakdown
