name: API-002 error message

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    if: github.head_ref == 'agent/complete-julos-work-breakdown' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0
      - name: Commit first validation error
        shell: bash
        run: |
          set -euo pipefail
          first="$(sed -n '2p' .tmp/api002-errors.txt | tr '\r\n' '  ' | cut -c1-220)"
          printf '%s\n' "$first" > .tmp/api002-first-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/api002-first-error.txt
          git commit -m "API002_ERROR: $first"
          git push origin HEAD:agent/complete-julos-work-breakdown
