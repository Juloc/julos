name: Beta4 normalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.ref == 'fix/browser-package-refresh-beta4' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Finalize Browser package metadata
        shell: bash
        run: |
          set -euo pipefail
          browser_hash="$(sha256sum packages/JulOS.Browser/frontend/browser.js | cut -d' ' -f1)"
          BROWSER_HASH="$browser_hash" node <<'NODE'
          const fs = require('fs');
          const path = 'packages/JulOS.Browser/manifest.json';
          const raw = fs.readFileSync(path, 'utf8').replace(/^\uFEFF/u, '');
          const manifest = JSON.parse(raw);
          manifest.Version = '1.0.1';
          manifest.Frontend.Sha256 = process.env.BROWSER_HASH;
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          sed -i 's/JulOS\.Browser-1\.0\.0\.zip/JulOS.Browser-1.0.1.zip/g' .github/workflows/release.yml
          node tools/normalize-encoding.mjs

      - name: Commit finalized files and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/beta4-normalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: finalize Beta4 package metadata'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
