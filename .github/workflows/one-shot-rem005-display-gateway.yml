name: One-shot REM-005 display gateway wiring

on:
  push:
    branches:
      - agent/rem-005-display-transport
    paths:
      - .github/workflows/one-shot-rem005-display-gateway.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rem-005-display-transport
          fetch-depth: 0
      - name: Inject display gateway into lifecycle service
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/JulOS.Infrastructure/Remote/PostgresRemoteSessionLifecycleService.cs")
          text = path.read_text(encoding="utf-8-sig")
          text = text.replace(
              "    private readonly IRealtimeEventPublisher events;\n    private readonly TimeProvider timeProvider;",
              "    private readonly IRealtimeEventPublisher events;\n    private readonly RemoteDisplayGateway displayGateway;\n    private readonly TimeProvider timeProvider;",
              1)
          text = text.replace(
              "        IRemoteRuntimeManager runtimeManager,\n        IRealtimeEventPublisher events,\n        TimeProvider timeProvider)",
              "        IRemoteRuntimeManager runtimeManager,\n        IRealtimeEventPublisher events,\n        RemoteDisplayGateway displayGateway,\n        TimeProvider timeProvider)",
              1)
          text = text.replace(
              "        this.events = events ?? throw new ArgumentNullException(nameof(events));\n        this.timeProvider = timeProvider ?? throw new ArgumentNullException(nameof(timeProvider));",
              "        this.events = events ?? throw new ArgumentNullException(nameof(events));\n        this.displayGateway = displayGateway ?? throw new ArgumentNullException(nameof(displayGateway));\n        this.timeProvider = timeProvider ?? throw new ArgumentNullException(nameof(timeProvider));",
              1)
          path.write_text(text, encoding="utf-8-sig")
          Path(".github/workflows/one-shot-rem005-display-gateway.yml").unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(remote): inject display gateway into lifecycle service"
          git push origin HEAD:agent/rem-005-display-transport
