# Single manual publication entry point for JulOS.

name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: What should be published?
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - session-runtimes
          - remote-transport

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  JULOS_PACKAGE_KEY_ID: official-alpha-2026

jobs:
  validate-dotnet:
    name: Validate .NET
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only
    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Release must be dispatched from main, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "VERSION is not a supported immutable version: $version" >&2
            exit 1
          fi
          if [[ "${{ inputs.target }}" == "prerelease" ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
              echo "Prerelease target requires an alpha or beta VERSION, got: $version" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "Tag v$version already exists; prereleases are immutable." >&2
              exit 1
            fi
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Validate .NET
        run: sh tools/validate.sh --stage version --stage restore --stage build --stage dotnet-test --stage server-smoke

  validate-desktop:
    name: Validate Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      - name: Validate Desktop
        run: sh tools/validate.sh --stage desktop-install --stage desktop-typecheck --stage desktop-test --stage desktop-build

  validate-frontends:
    name: Validate package frontends
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc

      - name: Validate package frontends
        run: sh tools/validate.sh --stage remote-frontend-install --stage remote-frontend-build --stage remote-frontend-test

  validate-meta:
    name: Validate metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc

      - name: Validate metadata
        run: sh tools/validate.sh --stage policy --stage markdown-links --stage package-manifests

  validate-container:
    name: Validate container build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc

      - name: Validate container build
        run: sh tools/validate.sh --stage container-build

  prerelease:
    name: Publish prerelease
    if: inputs.target == 'prerelease'
    needs: [validate-dotnet, validate-desktop, validate-frontends, validate-meta, validate-container]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc

      - name: Build and sign official packages
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.JULOS_PACKAGE_SIGNING_PRIVATE_KEY_PEM }}
          PACKAGE_PUBLISHER_ID: juloc-official
          PACKAGE_KEY_ID: ${{ env.JULOS_PACKAGE_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/stage-official-package-catalog.sh deploy/official-packages
          test -s deploy/official-packages/catalog.json
          test -s deploy/official-packages/juloc-package-signing-public.pem
          node <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('deploy/official-packages/catalog.json', 'utf8'));
          for (const pkg of catalog.packages) {
            for (const name of [pkg.artifactFile, pkg.signatureFile]) {
              const file = `deploy/official-packages/${name}`;
              if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
                throw new Error(`Missing official package asset: ${file}`);
              }
            }
          }
          NODE

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing server image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/juloc/julos-server:${{ needs.validate-dotnet.outputs.version }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Server image version already exists: $image" >&2
            exit 1
          fi

      - name: Publish server image
        id: server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/JulOS.Server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/juloc/julos-server:${{ needs.validate-dotnet.outputs.version }}
          build-args: |
            JULOS_VERSION=${{ needs.validate-dotnet.outputs.version }}
          cache-from: type=gha,scope=julos-server
          cache-to: type=gha,mode=max,scope=julos-server
          provenance: false
          sbom: true

      - name: Attest server image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/juloc/julos-server
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-dotnet.outputs.version }}"
          mkdir -p release-files
          cp deploy/alpha/compose.sqlite.yaml release-files/julos-beta-compose.yaml
          cp deploy/alpha/.env.sqlite.example release-files/julos-beta.env.example
          cp "docs/releases/$version.md" release-files/RELEASE_NOTES.md
          cp deploy/official-packages/catalog.json release-files/
          cp deploy/official-packages/juloc-package-signing-public.pem release-files/
          cp deploy/official-packages/JulOS.*-*.zip release-files/
          cp deploy/official-packages/JulOS.*-*.zip.sig release-files/
          (
            cd release-files
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | sort \
              | xargs sha256sum > SHA256SUMS
          )

      - name: Refuse changed bytes for an existing package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          prior_assets="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | .assets[] | [.name, (.digest // "")] | @tsv')"
          for package in release-files/JulOS.*-*.zip; do
            name="$(basename "$package")"
            digest="sha256:$(sha256sum "$package" | cut -d' ' -f1)"
            while IFS=$'\t' read -r prior_name prior_digest; do
              [[ "$prior_name" == "$name" ]] || continue
              if [[ -n "$prior_digest" && "$prior_digest" != "$digest" ]]; then
                echo "Package version was already published with different bytes: $name" >&2
                echo "Previous: $prior_digest" >&2
                echo "Current:  $digest" >&2
                exit 1
              fi
            done <<<"$prior_assets"
          done

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-dotnet.outputs.version }}"
          gh release create "v$version" \
            --target "$GITHUB_REF_NAME" \
            --title "JulOS $version" \
            --notes-file "docs/releases/$version.md" \
            --prerelease \
            release-files/*

      - name: Release summary
        shell: bash
        run: |
          {
            echo "### JulOS ${{ needs.validate-dotnet.outputs.version }}"
            echo
            echo "- Server: ghcr.io/juloc/julos-server@${{ steps.server.outputs.digest }}"
            echo "- GitHub prerelease: v${{ needs.validate-dotnet.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"


  session-runtimes:
    name: Publish session runtimes
    if: inputs.target == 'session-runtimes'
    needs: [validate-dotnet, validate-desktop, validate-frontends, validate-meta, validate-container]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing images
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-dotnet.outputs.version }}"
          for image in \
            "ghcr.io/juloc/julos-runtime-manager:$version" \
            "ghcr.io/juloc/julos-remote-provider:$version"; do
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Runtime image version already exists: $image" >&2
              exit 1
            fi
          done

      - name: Publish Runtime Manager
        id: manager
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/JulOS.RuntimeManager/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=julos-runtime-manager
          cache-to: type=gha,mode=max,scope=julos-runtime-manager
          tags: ghcr.io/juloc/julos-runtime-manager:${{ needs.validate-dotnet.outputs.version }}
          build-args: |
            JULOS_VERSION=${{ needs.validate-dotnet.outputs.version }}
          provenance: false
          sbom: true

      - name: Attest Runtime Manager
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/juloc/julos-runtime-manager
          subject-digest: ${{ steps.manager.outputs.digest }}
          push-to-registry: true

      - name: Publish Remote Provider
        id: provider
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/JulOS.Remote/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/juloc/julos-remote-provider:${{ needs.validate-dotnet.outputs.version }}
          build-args: |
            JULOS_VERSION=${{ needs.validate-dotnet.outputs.version }}
          cache-from: type=gha,scope=julos-remote-provider
          cache-to: type=gha,mode=max,scope=julos-remote-provider
          provenance: false
          sbom: true

      - name: Attest Remote Provider
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/juloc/julos-remote-provider
          subject-digest: ${{ steps.provider.outputs.digest }}
          push-to-registry: true

      - name: Runtime summary
        shell: bash
        run: |
          {
            echo "- Runtime Manager: ghcr.io/juloc/julos-runtime-manager@${{ steps.manager.outputs.digest }}"
            echo "- Remote Provider: ghcr.io/juloc/julos-remote-provider@${{ steps.provider.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  remote-transport:
    name: Publish Remote Transport
    if: inputs.target == 'remote-transport'
    needs: [validate-dotnet, validate-desktop, validate-frontends, validate-meta, validate-container]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate-dotnet.outputs.version }}"
          output="$RUNNER_TEMP/remote-transport-package"
          mkdir -p "$output"
          dotnet pack packages/JulOS.Remote/shared/JulOS.Remote.Transport/JulOS.Remote.Transport.csproj \
            --configuration Release \
            --output "$output" \
            -p:GeneratePackageOnBuild=false \
            -p:PackageVersion="$version" \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA"
          package="$output/JulOS.Remote.Transport.$version.nupkg"
          symbols="$output/JulOS.Remote.Transport.$version.snupkg"
          test -f "$package"
          test -f "$symbols"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "symbols=$symbols" >> "$GITHUB_OUTPUT"

      - name: Attest package
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.package.outputs.package }}
            ${{ steps.package.outputs.symbols }}

      - name: Configure GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget add source \
            --username "${{ github.repository_owner }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --valid-authentication-types basic \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          dotnet nuget push "${{ steps.package.outputs.package }}" \
            --source github \
            --api-key "$GITHUB_TOKEN" \
            --timeout 600

      - name: Package summary
        shell: bash
        run: |
          echo "- Remote Transport: JulOS.Remote.Transport ${{ needs.validate-dotnet.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
