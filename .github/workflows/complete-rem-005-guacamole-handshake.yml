name: Complete REM-005 Guacamole handshake

on:
  pull_request:
    branches:
      - agent/complete-julos-work-breakdown
    paths:
      - .github/workflows/complete-rem-005-guacamole-handshake.yml

permissions:
  contents: write

concurrency:
  group: complete-rem-005-guacamole-handshake
  cancel-in-progress: false

jobs:
  complete:
    if: github.repository == 'Juloc/julos' && github.head_ref == 'agent/rem-005-package-display-client'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-005-package-display-client
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Apply the Guacamole runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(relative, old, new):
              path = Path(relative)
              text = path.read_text(encoding='utf-8-sig')
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one anchor in {relative}: {old[:120]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_one(
              'src/JulOS.Server/Remote/RemoteDisplayEndpoints.cs',
              '''        if (!context.WebSockets.IsWebSocketRequest)
        {
            return Failure(
                StatusCodes.Status400BadRequest,
                "remote.display_websocket_required",
                "Remote display requires a WebSocket request.");
        }

        using var provider = new ClientWebSocket();
''',
              '''        if (!context.WebSockets.IsWebSocketRequest)
        {
            return Failure(
                StatusCodes.Status400BadRequest,
                "remote.display_websocket_required",
                "Remote display requires a WebSocket request.");
        }

        var requestedProtocols = context.WebSockets.WebSocketRequestedProtocols;
        if (requestedProtocols.Count != 1
            || !string.Equals(requestedProtocols[0], "guacamole", StringComparison.Ordinal))
        {
            return Failure(
                StatusCodes.Status400BadRequest,
                "remote.display_subprotocol_required",
                "Remote display requires the guacamole WebSocket subprotocol.");
        }

        using var provider = new ClientWebSocket();
        provider.Options.AddSubProtocol("guacamole");
''')

          replace_one(
              'src/JulOS.Server/Remote/RemoteDisplayEndpoints.cs',
              '''        using var browser = await context.WebSockets
            .AcceptWebSocketAsync()
            .ConfigureAwait(false);
''',
              '''        if (!string.Equals(provider.SubProtocol, "guacamole", StringComparison.Ordinal))
        {
            return Failure(
                StatusCodes.Status502BadGateway,
                "remote.display_provider_subprotocol_invalid",
                "The Remote display provider did not negotiate the guacamole WebSocket subprotocol.");
        }

        using var browser = await context.WebSockets
            .AcceptWebSocketAsync("guacamole")
            .ConfigureAwait(false);
''')

          replace_one(
              'tests/JulOS.Integration.Tests/Remote/RemoteDisplayEndpointTests.cs',
              '''        var webSocketClient = host.Server.CreateWebSocketClient();
        webSocketClient.ConfigureRequest = request =>
''',
              '''        var webSocketClient = host.Server.CreateWebSocketClient();
        webSocketClient.SubProtocols.Add("guacamole");
        webSocketClient.ConfigureRequest = request =>
''')

          replace_one(
              'tests/JulOS.Integration.Tests/Remote/RemoteDisplayEndpointTests.cs',
              '''        var payload = Encoding.UTF8.GetBytes("remote-display-roundtrip");
''',
              '''        Assert.AreEqual("guacamole", socket.SubProtocol);

        var payload = Encoding.UTF8.GetBytes("remote-display-roundtrip");
''')

          replace_one(
              'tests/JulOS.Integration.Tests/Remote/RemoteDisplayEndpointTests.cs',
              '''                    using var socket = await context.WebSockets
                        .AcceptWebSocketAsync()
                        .ConfigureAwait(false);
''',
              '''                    var requestedProtocols = context.WebSockets.WebSocketRequestedProtocols;
                    if (requestedProtocols.Count != 1
                        || !string.Equals(requestedProtocols[0], "guacamole", StringComparison.Ordinal))
                    {
                        context.Response.StatusCode = StatusCodes.Status400BadRequest;
                        return;
                    }

                    using var socket = await context.WebSockets
                        .AcceptWebSocketAsync("guacamole")
                        .ConfigureAwait(false);
''')

          replace_one(
              'packages/JulOS.Remote/frontend/remote.source.js',
              "      stage.addEventListener('pointerdown', () => stage.focus(), { passive: true });\n",
              "      stage.onpointerdown = () => stage.focus();\n")

          replace_one(
              'packages/JulOS.Remote/frontend/remote.source.js',
              '''      const stage = this.shadowRoot?.getElementById('stage');
      stage?.replaceChildren();
''',
              '''      const stage = this.shadowRoot?.getElementById('stage');
      if (stage !== null && stage !== undefined) {
        stage.onpointerdown = null;
        stage.replaceChildren();
      }
''')
          PY

          cd packages/JulOS.Remote/frontend
          npm ci
          npm run build
          npm test
          node --check remote.js
          cd ../../..

          dotnet restore JulOS.slnx
          dotnet build JulOS.slnx --no-restore
          node tools/normalize-encoding.mjs
          git diff --check

      - name: Commit the runtime contract
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/complete-rem-005-guacamole-handshake.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(remote): negotiate Guacamole WebSocket protocol'
          git push origin HEAD:agent/rem-005-package-display-client
