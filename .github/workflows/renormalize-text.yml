name: Renormalize repository text

on:
  push:
    branches:
      - agent/julos-1.0-agent-integration-gates
    paths:
      - .github/workflows/renormalize-text.yml

permissions:
  contents: write

jobs:
  renormalize:
    name: Renormalize tracked text blobs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          ref: agent/julos-1.0-agent-integration-gates

      - name: Renormalize and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --renormalize .
          if git diff --cached --quiet; then
            echo "Repository blobs already match .gitattributes."
            exit 0
          fi
          git commit -m "chore: renormalize repository text blobs"
          git push origin HEAD:agent/julos-1.0-agent-integration-gates
