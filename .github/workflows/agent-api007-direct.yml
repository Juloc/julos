name: Agent API-007 direct validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-api007-direct-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/complete-julos-work-breakdown'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      - name: Apply verified API-007 source
        shell: bash
        run: |
          set -euo pipefail
          hashes=(
            2a17eac1e0b03c7d8e51d0286628e0bec6202fcf547cda166d2218b89925631d
            1beef1f5d2dc6c158d1084cabd78c61569b878f59550dd4a34c0c071f3b78be2
            7b04710e65b69b7d02562af4fc7b3e26f5fa9673c6b29b4bfb814e1b47b2fb13
            b98f3788f103b1f8ad8728cf9350b0b308a1916567685f4a9730ace4051f11e5
            b683c929fd4f1d79cd62b5c50bdcc01b2d13e8c8787eb540318d3b959142adc7
            d937058d7aae85da5c443b89c9465328c56dbc67d3a07f7b53db2771ff08bd5f
            67490f63c6e888526237a7c7b241967bbcefbefef942878ce07895c51f74bc0a
            d24ff40713ae07322a85cb1be11da87b5a653bd7699c0a266d2e89b607671e79
            2cf8a6645e11511880da62ced76cc28fbdc3100e05c91c2029e97aa501c557c9
            c362ee3c10e61243c38a3de1ce5559a356f70630e1de16bb0c530429aaa1852b
            1b357f3b120910c8228af684295abc3581565dea32587de1059391480c5a7baa
            94abc5505090613b5e6e10f19fc27e1b856176d356a9ba724d000b00212e4b8d
            7c46956043fb806ff3f7621899ab5407de624e389c363dd8bf103670253d4e45
            2611977aa96d5a33d205bfd68bb00c67e4e1f16371d0af8e1815331e60ab3158
            96ce192f399f8348dfdf7c5dad661a07132be2e3f87869e690299c90f2715cc0
            e3c791032745a27a276427bb61ea3d6b6bd69787d5ce4a974a1c1510379184a9
          )

          : > /tmp/api007-direct.b64
          for index in "${!hashes[@]}"; do
            file=$(printf '.agent/api007-direct/part-%02d' "$index")
            normalized=$(printf '/tmp/api007-direct-part-%02d' "$index")
            tr -d '[:space:]' < "$file" > "$normalized"
            echo "${hashes[$index]}  $normalized" | sha256sum --check
            cat "$normalized" >> /tmp/api007-direct.b64
          done

          base64 --decode /tmp/api007-direct.b64 > /tmp/api007-direct.tar.gz
          echo "9f58bd8e9e81e3c9b21eb4e3394a7b83d8b55bb99118d211093bab070c970095  /tmp/api007-direct.tar.gz" | sha256sum --check
          tar -xzf /tmp/api007-direct.tar.gz -C .
          node tools/normalize-encoding.mjs

      - name: Compile the operation model
        run: |
          dotnet restore JulOS.slnx
          dotnet build JulOS.slnx --no-restore

      - name: Generate the operation migration
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet ef migrations add AddOperationResources \
            --project src/JulOS.Infrastructure/JulOS.Infrastructure.csproj \
            --context JulOS.Infrastructure.Persistence.Core.CoreDbContext \
            --output-dir Persistence/Core/Migrations

          migration=$(find src/JulOS.Infrastructure/Persistence/Core/Migrations -maxdepth 1 -name '*_AddOperationResources.cs' -print -quit)
          test -n "$migration"
          python3 - "$migration" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8-sig')
          up_end = '\n        }\n\n        /// <inheritdoc />\n        protected override void Down'
          if up_end not in text:
              raise SystemExit('Generated migration Up boundary was not found.')

          grant_sql = '''

              migrationBuilder.Sql(
                  """
                  INSERT INTO core.permission_assignments
                      (id, subject_kind, subject_id, permission, scope_kind, scope_id,
                       granted_at_utc, granted_by_user_id)
                  SELECT
                      uuidv7(),
                      'Role',
                      role.id,
                      permission.name,
                      'Global',
                      NULL,
                      CURRENT_TIMESTAMP,
                      setup.administrator_user_id
                  FROM core.roles AS role
                  CROSS JOIN core.authentication_setup AS setup
                  CROSS JOIN (
                      VALUES
                          ('core.operation.create'),
                          ('core.operation.read'),
                          ('core.operation.cancel')
                  ) AS permission(name)
                  WHERE role.normalized_name = 'ADMINISTRATOR'
                    AND setup.id = 1
                    AND setup.administrator_user_id IS NOT NULL
                    AND NOT EXISTS (
                        SELECT 1
                        FROM core.permission_assignments AS existing
                        WHERE existing.subject_kind = 'Role'
                          AND existing.subject_id = role.id
                          AND existing.permission = permission.name
                          AND existing.scope_kind = 'Global'
                          AND existing.scope_id IS NULL
                    );
                  """);
          '''
          text = text.replace(up_end, grant_sql + up_end, 1)

          down_start = '        protected override void Down(MigrationBuilder migrationBuilder)\n        {\n'
          if down_start not in text:
              raise SystemExit('Generated migration Down boundary was not found.')

          revoke_sql = '''
              migrationBuilder.Sql(
                  """
                  DELETE FROM core.permission_assignments AS assignment
                  USING core.roles AS role, core.authentication_setup AS setup
                  WHERE assignment.subject_kind = 'Role'
                    AND assignment.subject_id = role.id
                    AND assignment.permission IN (
                        'core.operation.create',
                        'core.operation.read',
                        'core.operation.cancel')
                    AND assignment.scope_kind = 'Global'
                    AND assignment.scope_id IS NULL
                    AND assignment.granted_by_user_id = setup.administrator_user_id
                    AND role.normalized_name = 'ADMINISTRATOR'
                    AND setup.id = 1;
                  """);

          '''
          text = text.replace(down_start, down_start + revoke_sql, 1)
          path.write_text('\ufeff' + text, encoding='utf-8')
          PY

          node tools/normalize-encoding.mjs

      - name: Run full repository validation
        run: sh tools/validate.sh

      - name: Commit validated API-007 result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent .agent-diagnostic
          rm -f \
            .github/workflows/agent-api007.yml \
            .github/workflows/agent-api007-v2.yml \
            .github/workflows/agent-api007-v3.yml \
            .github/workflows/agent-api007-diagnostic.yml \
            .github/workflows/agent-api007-diagnostic2.yml \
            .github/workflows/agent-api007-converge.yml \
            .github/workflows/agent-source-sync.yml \
            .github/workflows/agent-api007-direct.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete API-007 operation resources"
          git push origin HEAD:${{ github.head_ref }}
