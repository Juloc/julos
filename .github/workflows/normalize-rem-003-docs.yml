name: Normalize REM-003 documentation

on:
  push:
    branches:
      - agent/complete-rem-003
    paths:
      - docs/BACKLOG.md
      - docs/JULGATE-REMOTE-EXTRACTION.md
      - docs/JULGATE_MIGRATION.md
      - .github/workflows/normalize-rem-003-docs.yml

permissions:
  contents: write

concurrency:
  group: normalize-rem-003-docs
  cancel-in-progress: false

jobs:
  normalize:
    if: github.repository == 'Juloc/julos'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/complete-rem-003
          persist-credentials: true

      - name: Normalize repository encoding
        run: node tools/normalize-encoding.mjs

      - name: Commit normalized documentation
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          if [[ -z "$changed" ]]; then
            exit 0
          fi
          test "$(git status --short | wc -l)" -eq 3
          git status --short | grep --fixed-strings 'docs/BACKLOG.md'
          git status --short | grep --fixed-strings 'docs/JULGATE-REMOTE-EXTRACTION.md'
          git status --short | grep --fixed-strings 'docs/JULGATE_MIGRATION.md'
          git add docs/BACKLOG.md docs/JULGATE-REMOTE-EXTRACTION.md docs/JULGATE_MIGRATION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(docs): normalize REM-003 encoding'
          git push origin HEAD:agent/complete-rem-003
