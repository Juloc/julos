# Publishes the shared Remote transport package only from validated main pushes.

name: Publish Remote Transport

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - packages/JulOS.Remote/shared/JulOS.Remote.Transport/**
      - .github/workflows/publish-remote-transport.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-remote-transport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, attest and publish
    if: github.repository == 'Juloc/julos'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Validate the complete repository
        run: sh tools/validate.sh

      - name: Build the immutable package artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "VERSION is not a supported immutable NuGet version: $version" >&2
            exit 1
          fi

          output="$RUNNER_TEMP/remote-transport-package"
          rm -rf "$output"
          mkdir -p "$output"

          dotnet pack \
            packages/JulOS.Remote/shared/JulOS.Remote.Transport/JulOS.Remote.Transport.csproj \
            --configuration Release \
            --no-restore \
            --output "$output" \
            -p:GeneratePackageOnBuild=false \
            -p:PackageVersion="$version" \
            -p:ContinuousIntegrationBuild=true \
            -p:RepositoryCommit="$GITHUB_SHA"

          package="$output/JulOS.Remote.Transport.$version.nupkg"
          symbols="$output/JulOS.Remote.Transport.$version.snupkg"
          test -f "$package"
          test -f "$symbols"
          test "$(find "$output" -maxdepth 1 -type f -name '*.nupkg' | wc -l)" -eq 1
          test "$(find "$output" -maxdepth 1 -type f -name '*.snupkg' | wc -l)" -eq 1

          (
            cd "$output"
            sha256sum \
              "$(basename "$package")" \
              "$(basename "$symbols")" \
              > SHA256SUMS
          )

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "directory=$output" >> "$GITHUB_OUTPUT"
          echo "package_path=$package" >> "$GITHUB_OUTPUT"
          echo "symbol_path=$symbols" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$output/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Attest package provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.package.outputs.package_path }}
            ${{ steps.package.outputs.symbol_path }}
            ${{ steps.package.outputs.checksum_path }}

      - name: Upload package evidence
        uses: actions/upload-artifact@v7
        with:
          name: JulOS.Remote.Transport-${{ steps.package.outputs.version }}-${{ github.sha }}
          path: ${{ steps.package.outputs.directory }}
          if-no-files-found: error
          retention-days: 3

      - name: Configure the GitHub NuGet source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source \
            --username "${{ github.repository_owner }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --valid-authentication-types basic \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish without overwriting an existing version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget push \
            "${{ steps.package.outputs.package_path }}" \
            --source github \
            --api-key "$GITHUB_TOKEN" \
            --timeout 600