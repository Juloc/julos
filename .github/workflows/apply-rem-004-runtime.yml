# One-shot branch-local patch application. Removed by the generated commit.
name: Apply REM-004 runtime allocation

on:
  push:
    branches:
      - agent/rem-004-runtime-allocation
    paths:
      - .github/workflows/apply-rem-004-runtime.yml

permissions:
  contents: write

concurrency:
  group: apply-rem-004-runtime
  cancel-in-progress: false

