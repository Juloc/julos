name: Fix REM-005 display build

on:
  push:
    branches:
      - agent/rem-005-display-transport
    paths:
      - .github/workflows/fix-rem-005-display-build.yml

permissions:
  contents: write

concurrency:
  group: fix-rem-005-display-build
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'Juloc/julos'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-005-display-transport
          persist-credentials: true

      - name: Correct Base64URL padding expression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/JulOS.Infrastructure/Remote/RemoteDisplayGateway.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = '        padded += padded.Length % 4 switch\n'
          new = '        padded += (padded.Length % 4) switch\n'
          if text.count(old) != 1:
              raise RuntimeError('Expected exactly one Base64URL padding expression.')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          node tools/normalize-encoding.mjs
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git add src/JulOS.Infrastructure/Remote/RemoteDisplayGateway.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(remote): correct display token padding expression'
          git push origin HEAD:agent/rem-005-display-transport
