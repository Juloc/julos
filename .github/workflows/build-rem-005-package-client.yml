name: Build REM-005 package display client

on:
  pull_request:
    branches:
      - agent/complete-julos-work-breakdown
    paths:
      - .github/workflows/build-rem-005-package-client.yml

permissions:
  contents: write

concurrency:
  group: build-rem-005-package-client
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Juloc/julos' && github.head_ref == 'agent/rem-005-package-display-client'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-005-package-display-client
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Complete repository integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(relative, old, new):
              path = Path(relative)
              text = path.read_text(encoding='utf-8-sig')
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one anchor in {relative}: {old[:100]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_one(
              'packages/JulOS.Remote/frontend/remote.source.js',
              '      this.#session = null;\n      this.#setBusy(true);\n',
              '      this.#session = null;\n      this.#pollAttempt = 0;\n      this.#setBusy(true);\n')

          replace_one(
              'tools/validate.mjs',
              "const desktopDirectory = join(repositoryRoot, 'src', 'JulOS.Desktop');\n",
              "const desktopDirectory = join(repositoryRoot, 'src', 'JulOS.Desktop');\nconst remoteFrontendDirectory = join(repositoryRoot, 'packages', 'JulOS.Remote', 'frontend');\n")

          replace_one(
              'tools/validate.mjs',
              "  {\n    name: 'markdown-links',\n    title: 'Validate relative Markdown links',\n",
              "  {\n    name: 'remote-frontend-install',\n    title: 'Install Remote frontend build dependencies',\n    async run() {\n      if (await exists(join(remoteFrontendDirectory, 'node_modules'))) {\n        return skipped('node_modules is already present');\n      }\n      return run('npm', ['ci'], remoteFrontendDirectory);\n    },\n  },\n  {\n    name: 'remote-frontend-build',\n    title: 'Build the Remote package frontend',\n    run: () => run('npm', ['run', 'build'], remoteFrontendDirectory),\n  },\n  {\n    name: 'remote-frontend-test',\n    title: 'Run Remote package frontend tests',\n    run: () => run('npm', ['test'], remoteFrontendDirectory),\n  },\n  {\n    name: 'markdown-links',\n    title: 'Validate relative Markdown links',\n")

          replace_one(
              'docs/BACKLOG.md',
              '| REM-005 | Functional Remote display client and same-origin transport | In progress | Token-free graphical descriptors, exact durable authorization and the same-origin WebSocket proxy are implemented in PR #38; package rendering and input remain. |\n| Phase 6 | Remote and Browser | In progress | REM-001 through REM-004 are complete; REM-005 transport is in progress and its package display/input client remains. Existing package shells are not complete display implementations. |\n',
              '| REM-005 | Functional Remote display client and same-origin transport | In progress | Token-free transport is merged; PR #39 adds the official Apache Guacamole 1.6.0 package client, single keyboard/InputSink path, pointer/touch input, resize, full-screen, reconnect and teardown. |\n| Phase 6 | Remote and Browser | In progress | REM-001 through REM-004 are complete; REM-005 has functional transport and package display work in progress. Browser remains planned. |\n')

          replace_one(
              'docs/BACKLOG.md',
              'REM-005 now begins with a token-free graphical descriptor and one authenticated same-origin WebSocket proxy. The server validates the configured public Origin, authenticated user, caller package selector, active durable session, exact revision, exact stored endpoint and descriptor expiry before resolving the hidden provider endpoint. Stale, expired, detached and terminal presentation state is rejected. Package rendering, resizing, input, full-screen and touch behavior remain in the next REM-005 slices.\n',
              'REM-005 has a token-free graphical descriptor and authenticated same-origin WebSocket proxy. PR #39 builds the existing Remote custom element with the official Apache Guacamole 1.6.0 browser artifact, pinned by ZIP and library SHA-256. One `Guacamole.Keyboard` receives desktop and mobile `InputSink` events, exactly one pointer or touchscreen adapter is active, resize uses the protocol size instruction, and reconnect, full-screen, failure and teardown states are visible. The remaining REM-005 work is deployed provider validation and any provider-specific UX defects found there.\n')
          PY

          cd packages/JulOS.Remote/frontend
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
          npm test
          node --check remote.js
          cd ../../..

          node tools/normalize-encoding.mjs
          git diff --check

      - name: Commit generated client and integration
        shell: bash
        run: |
          set -euo pipefail
          git add packages/JulOS.Remote tools/validate.mjs docs/BACKLOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(remote): build functional package display client'
          git push origin HEAD:agent/rem-005-package-display-client
