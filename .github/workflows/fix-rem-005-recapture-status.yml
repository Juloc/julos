name: Fix REM-005 keyboard recapture status

on:
  push:
    branches:
      - agent/rem-005-input-resize-acceptance
    paths:
      - .github/workflows/fix-rem-005-recapture-status.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'Juloc/julos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rem-005-input-resize-acceptance
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Remove the false connection status
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("packages/JulOS.Remote/frontend/remote.source.js"); t=p.read_text(encoding="utf-8-sig"); old="      stage.onpointerdown = () => {\n        stage.focus();\n        this.#setStatus(context.language === '\''de'\'' ? '\''Verbunden'\'' : '\''Connected'\'', '\''connected'\'');\n      };\n"; new="      stage.onpointerdown = () => stage.focus();\n"; assert t.count(old) == 1; p.write_text(t.replace(old, new), encoding="utf-8", newline="\n")'
          cd packages/JulOS.Remote/frontend
          npm ci
          npm run build
          npm test
          node --check remote.js
          cd ../../..
          node tools/normalize-encoding.mjs
          git diff --check
      - name: Commit the product fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-rem-005-recapture-status.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(remote): avoid false recapture success state'
          git push origin HEAD:agent/rem-005-input-resize-acceptance
