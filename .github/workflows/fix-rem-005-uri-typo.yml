name: Fix REM-005 URI typo

on:
  pull_request:
    branches:
      - agent/complete-julos-work-breakdown
    paths:
      - .github/workflows/fix-rem-005-uri-typo.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'Juloc/julos' && github.head_ref == 'agent/rem-005-display-transport'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-005-display-transport
          persist-credentials: true

      - name: Correct URI parser call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/JulOS.Infrastructure/Remote/RemoteDisplayGateway.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = '!UriTryCreate(value, UriKind.Absolute, out var origin)'
          new = '!Uri.TryCreate(value, UriKind.Absolute, out var origin)'
          if text.count(old) != 1:
              raise RuntimeError('Expected one malformed URI parser call.')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          node tools/normalize-encoding.mjs
          git diff --check

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git add src/JulOS.Infrastructure/Remote/RemoteDisplayGateway.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(remote): correct display origin parser call'
          git push origin HEAD:agent/rem-005-display-transport
