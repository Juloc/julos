name: Transfer AGT-002 implementation

on:
  push:
    branches:
      - agent/julos-1.0-agent-enrollment-bootstrap-clean
    paths:
      - .github/workflows/copy-agt002.yml

permissions:
  contents: write

jobs:
  transfer:
    name: Copy only reviewed AGT-002 files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the clean branch
        uses: actions/checkout@v7
        with:
          ref: agent/julos-1.0-agent-enrollment-bootstrap-clean
          fetch-depth: 0

      - name: Copy reviewed implementation and remove this workflow
        run: |
          git fetch origin agent/julos-1.0-agent-enrollment-bootstrap
          git checkout origin/agent/julos-1.0-agent-enrollment-bootstrap -- \
            src/JulOS.Agent/AgentBootstrapOptions.cs \
            src/JulOS.Agent/AgentEnrollmentClient.cs \
            src/JulOS.Agent/AgentIdentityStore.cs \
            src/JulOS.Agent/AgentOptions.cs \
            src/JulOS.Agent/AgentProvisioner.cs \
            src/JulOS.Agent/AgentProvisioningState.cs \
            src/JulOS.Agent/Program.cs \
            src/JulOS.Contracts/Agents/AgentContracts.cs \
            src/JulOS.Infrastructure/Agents/PostgresAgentControlService.cs \
            tests/JulOS.Agent.Tests/AgentIdentityStoreTests.cs \
            tests/JulOS.Agent.Tests/AgentOptionsTests.cs \
            tests/JulOS.Integration.Tests/Agents/AgentEndpointTests.cs
          git rm .github/workflows/copy-agt002.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): add secure first-run enrollment"
          git push origin HEAD:agent/julos-1.0-agent-enrollment-bootstrap-clean
