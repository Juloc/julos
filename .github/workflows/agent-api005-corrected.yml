name: Agent API-005 diagnostic validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-api005-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/complete-julos-work-breakdown'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      - name: Apply verified API-005 source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .agent/api005/part-00 ]; then
            echo "API-005 source already applied."
            exit 0
          fi

          declare -a hashes=(
            8732457af773cc627457ead6db3fe0d7ddcce956e7c68d0840da4995fd1d0290
            ed3c726755be70bf643b357c0e72d61e93d8ba35887427064ffb0d3ef34bb0e9
            932851a4643602289ca9222d86eb4d55bec3326ea75f7db436bf0ecfc1511027
            7da291478864ecd09e9ef329747a858f5f4d4d1b8ce9c90af6e53d6bc874b006
            883da42d84b0ec73b3d036de1d41f52851e731c621b4ec1a8933d7272582351b
            8c48d3d68c43eb4e7036fa4a48c35a95de9fb815989f92cf02ee1a4b2522e58f
            66a6514fe909c5e8d35b5f7fd995f633b113083f641d1504ed1bc37c7cd539cb
            830c35376d59a0c29373c6d99efb1856f44ece44b4be6f742fdbbe07df39be8c
            6b0d2de5e7c94e63917abb04d2b390b29085bf90d691611911d129105fa65612
          )

          : > /tmp/api005-files.b64
          for index in "${!hashes[@]}"; do
            file=$(printf '.agent/api005/part-%02d' "$index")
            normalized=$(printf '/tmp/api005-part-%02d' "$index")
            tr -d '[:space:]' < "$file" > "$normalized"
            echo "${hashes[$index]}  $normalized" | sha256sum --check
            cat "$normalized" >> /tmp/api005-files.b64
          done

          base64 --decode /tmp/api005-files.b64 > /tmp/api005-files.tar.gz
          echo "0fec4529a388a281be9a3c768ff908f3ca1923586ba32f99bf310f0c31cc97fe  /tmp/api005-files.tar.gz" | sha256sum --check
          tar -xzf /tmp/api005-files.tar.gz -C .

          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/JulOS.Integration.Tests/Profile/ProfileTests.cs')
          text = path.read_text(encoding='utf-8-sig').replace('revision:', 'Revision:')
          path.write_text('\ufeff' + text, encoding='utf-8')
          PY

          rm -rf .agent
          node tools/normalize-encoding.mjs

      - name: Compile API-005 model
        run: |
          dotnet restore JulOS.slnx
          dotnet build JulOS.slnx --no-restore

      - name: Generate and inspect profile migration
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet ef migrations add AddProfilePreferences \
            --project src/JulOS.Infrastructure/JulOS.Infrastructure.csproj \
            --context JulOS.Infrastructure.Persistence.Core.CoreDbContext \
            --output-dir Persistence/Core/Migrations
          node tools/normalize-encoding.mjs
          echo '--- generated migration ---'
          migration=$(find src/JulOS.Infrastructure/Persistence/Core/Migrations -maxdepth 1 -name '*_AddProfilePreferences.cs' -print -quit)
          test -n "$migration"
          sed -n '1,260p' "$migration"

      - name: Run focused setup diagnostic
        shell: bash
        run: |
          set -o pipefail
          dotnet build JulOS.slnx --no-restore
          dotnet test tests/JulOS.Integration.Tests/JulOS.Integration.Tests.csproj \
            --no-build \
            --filter 'FullyQualifiedName~InitialSetupCreatesAdministratorAndProtectsTheApi' \
            --logger 'console;verbosity=detailed' \
            > /tmp/setup-test.log 2>&1 || {
              echo '--- focused setup failure ---'
              tail -n 350 /tmp/setup-test.log
              exit 1
            }
          cat /tmp/setup-test.log

      - name: Run full repository validation
        run: sh tools/validate.sh

      - name: Commit validated API-005 result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete API-005 profile preferences"
          git push origin HEAD:${{ github.head_ref }}
