name: Generate Core migration

on:
  push:
    branches:
      - agent/complete-julos-work-breakdown

permissions:
  contents: write

concurrency:
  group: generate-core-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore JulOS.slnx

      - name: Generate migration
        run: >-
          dotnet ef migrations add AddDesktopPackagesAndAgents
          --project src/JulOS.Infrastructure/JulOS.Infrastructure.csproj
          --context CoreDbContext
          --output-dir Persistence/Core/Migrations
          --no-build

      - name: Normalize generated text
        run: node tools/normalize-encoding.mjs

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/JulOS.Infrastructure/Persistence/Core/Migrations
          git commit -m "Add Desktop package and Agent persistence migration"
          git push origin HEAD:agent/complete-julos-work-breakdown
