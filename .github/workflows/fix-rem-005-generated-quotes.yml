name: Fix REM-005 generated quotes

on:
  pull_request:
    branches:
      - agent/complete-julos-work-breakdown
    paths:
      - .github/workflows/fix-rem-005-generated-quotes.yml

permissions:
  contents: write

concurrency:
  group: fix-rem-005-generated-quotes
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'Juloc/julos' && github.head_ref == 'agent/rem-005-display-transport'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-005-display-transport
          persist-credentials: true

      - name: Remove accidental JSON escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/JulOS.Infrastructure/Remote/RemoteDisplayGateway.cs'),
              Path('src/JulOS.Infrastructure/Remote/PostgresRemoteDisplayAuthorizationService.cs'),
              Path('src/JulOS.Server/Remote/RemoteDisplayEndpoints.cs'),
              Path('tests/JulOS.Infrastructure.Tests/Remote/RemoteDisplayGatewayTests.cs'),
              Path('tests/JulOS.Integration.Tests/Remote/RemoteDisplayEndpointTests.cs'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8-sig')
              count = text.count('\\"')
              if count == 0:
                  raise RuntimeError(f'No accidental quote escapes found in {path}.')
              path.write_text(text.replace('\\"', '"'), encoding='utf-8', newline='\n')
          PY
          node tools/normalize-encoding.mjs
          git diff --check

      - name: Commit corrected sources
        shell: bash
        run: |
          set -euo pipefail
          git add src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(remote): remove generated quote escapes'
          git push origin HEAD:agent/rem-005-display-transport
