name: Activate Linux Agent daemon

on:
  push:
    branches:
      - agent/complete-julos-work-breakdown

permissions:
  contents: write

concurrency:
  group: build-agent-daemon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0

      - name: Replace Agent placeholder entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('src/JulOS.Agent/Program.cs').write_bytes('''﻿using System.Collections;\r
\r
using JulOS.Agent;\r
\r
var environment = Environment.GetEnvironmentVariables()\r
    .Cast<DictionaryEntry>()\r
    .ToDictionary(\r
        entry => Convert.ToString(entry.Key, System.Globalization.CultureInfo.InvariantCulture) ?? string.Empty,\r
        entry => Convert.ToString(entry.Value, System.Globalization.CultureInfo.InvariantCulture),\r
        StringComparer.Ordinal);\r
var options = AgentOptions.Read(environment);\r
var timeProvider = TimeProvider.System;\r
using var httpClient = new HttpClient\r
{\r
    BaseAddress = options.ServerEndpoint,\r
    Timeout = TimeSpan.FromSeconds(30),\r
};\r
var collector = new LinuxMetricsCollector(timeProvider);\r
var executor = new AgentCommandExecutor(timeProvider, options.Version);\r
var agent = new AgentClient(httpClient, options, collector, executor, timeProvider);\r
using var shutdown = new CancellationTokenSource();\r
Console.CancelKeyPress += (_, eventArgs) =>\r
{\r
    eventArgs.Cancel = true;\r
    shutdown.Cancel();\r
};\r
\r
while (!shutdown.IsCancellationRequested)\r
{\r
    try\r
    {\r
        await agent.RunAsync(shutdown.Token).ConfigureAwait(false);\r
    }\r
    catch (OperationCanceledException) when (shutdown.IsCancellationRequested)\r
    {\r
        break;\r
    }\r
    catch (HttpRequestException exception)\r
    {\r
        Console.Error.WriteLine($"Agent connection failed with HTTP status {exception.StatusCode?.ToString() ?? "unavailable"}.");\r
        await Task.Delay(TimeSpan.FromSeconds(5), timeProvider, shutdown.Token).ConfigureAwait(false);\r
    }\r
}\r
'''.encode('utf-8'))
          PY

      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-agent-daemon.yml
          git add src/JulOS.Agent/Program.cs
          git commit -m "Activate Linux Agent daemon"
          git push origin HEAD:agent/complete-julos-work-breakdown
