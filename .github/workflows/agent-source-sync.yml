name: Agent source sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/complete-julos-work-breakdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Remove Git metadata
        run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: julos-current-source
          path: .
          include-hidden-files: true
          retention-days: 1
