name: Complete REM-006 account failure contract

on:
  push:
    branches:
      - agent/rem-006-rdp-provider-policy
    paths:
      - .github/workflows/complete-rem-006-account-failure.yml

permissions:
  contents: write

jobs:
  complete:
    if: github.repository == 'Juloc/julos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rem-006-rdp-provider-policy
          persist-credentials: true
      - name: Add account-unavailable failure contract and test
        shell: bash
        run: |
          set -euo pipefail
          cat > src/JulOS.Contracts/Remote/RemoteProviderFailureCodes.cs <<'EOF'
          namespace JulOS.Contracts.Remote;

          /// <summary>Caller-safe failures emitted by trusted Remote protocol providers.</summary>
          public static class RemoteProviderFailureCodes
          {
              /// <summary>The target account is disabled, locked, expired or otherwise unavailable.</summary>
              public const string AccountUnavailable = "remote.account_unavailable";
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path

          service = Path('src/JulOS.Infrastructure/Remote/PostgresRemoteSessionConnectionService.cs')
          text = service.read_text(encoding='utf-8-sig')
          old = '''            or RemoteSessionFailureCodes.AuthenticationFailed
            or RemoteSessionFailureCodes.ConnectionLost))
'''
          new = '''            or RemoteSessionFailureCodes.AuthenticationFailed
            or RemoteProviderFailureCodes.AccountUnavailable
            or RemoteSessionFailureCodes.ConnectionLost))
'''
          if text.count(old) != 1:
              raise RuntimeError('Expected provider failure allowlist anchor once.')
          service.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          tests = Path('tests/JulOS.Integration.Tests/Remote/RemoteSessionConnectionTests.cs')
          text = tests.read_text(encoding='utf-8-sig')
          anchor = '''    [TestMethod]
    public async Task ActivityUsesServerTimeAndCoalescesFrequentWrites()
'''
          method = '''    [TestMethod]
    public async Task AccountUnavailableRemainsDistinctFromInvalidCredentials()
    {
        await using var database = await CreateMigratedDatabaseAsync().ConfigureAwait(false);
        var clock = new MutableTimeProvider(new DateTimeOffset(2026, 8, 5, 8, 0, 0, TimeSpan.Zero));
        var runtime = new RecordingRuntimeManager();
        var networkProfileId = Guid.Parse("88888888-8888-4888-8888-888888888888");
        using var host = CreateHost(database.ConnectionString, networkProfileId, runtime, clock);
        using var client = host.CreateClient(ClientOptions);
        var administrator = await SetupAdministratorAsync(client).ConfigureAwait(false);

        await using var scope = host.Services.CreateAsyncScope();
        var provisioned = await CreateProvisionedSessionAsync(
            scope.ServiceProvider,
            administrator.UserId,
            networkProfileId,
            clock,
            "remote-provider-account-unavailable").ConfigureAwait(false);
        var runtimeId = $"remote-{provisioned.SessionId:N}";
        var connections = scope.ServiceProvider.GetRequiredService<IRemoteSessionConnectionService>();

        var failed = await connections.FailAsync(new FailRemoteSessionCommand(
            provisioned.SessionId,
            runtimeId,
            provisioned.Revision,
            RemoteProviderFailureCodes.AccountUnavailable,
            "The target account is unavailable.",
            Retryable: false)).ConfigureAwait(false);

        Assert.AreEqual(RemoteSessionStates.Failed, failed.State);
        Assert.IsNotNull(failed.Failure);
        Assert.AreEqual(RemoteProviderFailureCodes.AccountUnavailable, failed.Failure.Code);
        Assert.AreNotEqual(RemoteSessionFailureCodes.AuthenticationFailed, failed.Failure.Code);
        Assert.AreEqual("The target account is unavailable.", failed.Failure.Detail);
        Assert.IsFalse(failed.Failure.Retryable);
    }

'''
          if text.count(anchor) != 1:
              raise RuntimeError('Expected activity-test anchor once.')
          tests.write_text(text.replace(anchor, method + anchor), encoding='utf-8', newline='\n')
          PY
          node tools/normalize-encoding.mjs
          git diff --check
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/complete-rem-006-account-failure.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(remote): distinguish unavailable target accounts'
          git push origin HEAD:agent/rem-006-rdp-provider-policy
