name: Agent API-004 final validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-api004-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/complete-julos-work-breakdown'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      - name: Apply verified final API-004 delta
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .agent/api004-final/part-00 ]; then
            echo "Delta already applied."
            exit 0
          fi
          echo "95b35ef6aa47cb66bd9ee139335be4f98e0699c2c9c1d00aa4f96a7625c820b1  .agent/api004-final/part-00" | sha256sum --check
          echo "4a8d18a6243580de207e25204044a1b77218c9b8aa0890448e32e16034eb2e6e  .agent/api004-final/part-01" | sha256sum --check
          echo "4f4e62d2f6c5410605f36e2d881cd609ee12e1ea2ceb70095bdfcc412ecd559b  .agent/api004-final/part-02" | sha256sum --check
          echo "7003bc37211debeb6a0478eb89ea7bbfa8fa5babb5e45ae7e4d7b9b391bf4036  .agent/api004-final/part-03" | sha256sum --check
          cat .agent/api004-final/part-* | base64 --decode | gzip -dc > /tmp/api004-final.patch
          echo "e035dc4d4f3a401c8384265c9271eeb7764bfb254afd04bf2868e36a3c7b594c  /tmp/api004-final.patch" | sha256sum --check
          git apply --check /tmp/api004-final.patch
          git apply /tmp/api004-final.patch

          echo "2f0c2fb8a4030cef8add689a7deb7578661a176ac093f3bcc30f478965124464  .agent/api004-migration.b64" | sha256sum --check
          base64 --decode .agent/api004-migration.b64 > /tmp/api004-migration.tar.gz
          echo "e9044483d15942419ba03143fbd0b9193c4a338e35d1d225003b3342ebc1cf1d  /tmp/api004-migration.tar.gz" | sha256sum --check
          tar -xzf /tmp/api004-migration.tar.gz -C .

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/JulOS.Server/Authorization/AuthorizationEndpoints.cs')
          text = path.read_text(encoding='utf-8-sig')
          text = text.replace(
              'using JulOS.Application.Authorization;\n',
              'using JulOS.Application.Authentication;\nusing JulOS.Application.Authorization;\n')
          text = text.replace(
              'using Microsoft.AspNetCore.Antiforgery;\n',
              'using Microsoft.AspNetCore.Antiforgery;\nusing Microsoft.Extensions.DependencyInjection;\n')
          group_anchor = '''        var group = endpoints\n            .MapGroup("/api/v1/authorization")\n            .WithTags("Authorization");\n'''
          group_replacement = group_anchor + '''\n        group.AddEndpointFilter(ValidateAntiforgeryAsync);\n'''
          if group_anchor not in text:
              raise SystemExit('Authorization route-group anchor not found.')
          text = text.replace(group_anchor, group_replacement)
          metadata_anchor = '    private sealed class RequiredAntiforgeryMetadata : IAntiforgeryMetadata\n'
          validator = '''    private static async ValueTask<object?> ValidateAntiforgeryAsync(\n        EndpointFilterInvocationContext context,\n        EndpointFilterDelegate next)\n    {\n        if (!HttpMethods.IsGet(context.HttpContext.Request.Method))\n        {\n            var antiforgery = context.HttpContext.RequestServices.GetRequiredService<IAntiforgery>();\n            try\n            {\n                await antiforgery.ValidateRequestAsync(context.HttpContext).ConfigureAwait(false);\n            }\n            catch (AntiforgeryValidationException exception)\n            {\n                throw new AuthenticationFailureException(\n                    AuthenticationFailureReason.AntiforgeryInvalid,\n                    exception);\n            }\n        }\n\n        return await next(context).ConfigureAwait(false);\n    }\n\n'''
          if metadata_anchor not in text:
              raise SystemExit('Authorization antiforgery metadata anchor not found.')
          text = text.replace(metadata_anchor, validator + metadata_anchor)
          path.write_text('\ufeff' + text, encoding='utf-8')
          PY

          rm -rf .agent
          node tools/normalize-encoding.mjs

      - name: Run full repository validation
        run: sh tools/validate.sh

      - name: Commit validated API-004 result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete API-004 role and permission authorization"
          git push origin HEAD:${{ github.head_ref }}
