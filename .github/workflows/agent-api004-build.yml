name: Agent API-004 migration export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-api004-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    if: github.head_ref == 'agent/complete-julos-work-breakdown'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Generate API-004 migration
        run: |
          dotnet tool restore
          dotnet restore JulOS.slnx
          dotnet ef migrations add AddRoleAuthorization \
            --project src/JulOS.Infrastructure/JulOS.Infrastructure.csproj \
            --context JulOS.Infrastructure.Persistence.Core.CoreDbContext \
            --output-dir Persistence/Core/Migrations
          node tools/normalize-encoding.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: api004-migration
          path: src/JulOS.Infrastructure/Persistence/Core/Migrations
          if-no-files-found: error
          retention-days: 1
