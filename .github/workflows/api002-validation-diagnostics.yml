name: API-002 validation diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.head_ref == 'agent/complete-julos-work-breakdown'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json
      - run: dotnet tool restore
      - name: Capture validation output
        shell: bash
        run: |
          set +e
          sh tools/validate.sh > validation.log 2>&1
          code=$?
          echo "$code" > validation-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: api002-validation-log
          path: |
            validation.log
            validation-exit-code.txt
          if-no-files-found: error
          retention-days: 1
