name: Transfer AGT-003 implementation

on:
  push:
    branches:
      - agent/julos-1.0-agent-command-capabilities-clean
    paths:
      - .github/workflows/copy-agt003.yml

permissions:
  contents: write

jobs:
  transfer:
    name: Copy only reviewed AGT-003 files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the clean branch
        uses: actions/checkout@v7
        with:
          ref: agent/julos-1.0-agent-command-capabilities-clean
          fetch-depth: 0

      - name: Copy reviewed implementation and remove this workflow
        run: |
          git fetch origin agent/julos-1.0-agent-command-capabilities
          git checkout origin/agent/julos-1.0-agent-command-capabilities -- \
            src/JulOS.Infrastructure/Agents/PostgresAgentControlService.Commands.cs \
            src/JulOS.Infrastructure/Agents/PostgresAgentControlService.cs \
            tests/JulOS.Integration.Tests/Agents/AgentCommandCapabilityTests.cs \
            tests/JulOS.Integration.Tests/Agents/AgentEndpointTests.cs
          git rm .github/workflows/copy-agt003.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): enforce advertised command capabilities"
          git push origin HEAD:agent/julos-1.0-agent-command-capabilities-clean
