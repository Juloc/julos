name: Adaptive Browser runtimes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-browser-runtimes-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  validate:
    name: Validate Adaptive Browser
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require main and read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Adaptive Browser runtimes must be dispatched from main, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
            echo "Adaptive Browser runtime publication requires a JulOS alpha/beta VERSION, got: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc

      - name: Validate
        run: >-
          sh tools/validate.sh
          --stage version
          --stage restore
          --stage build
          --stage dotnet-test
          --stage adaptive-browser-frontend-test
          --stage package-manifests

  publish:
    name: Publish Adaptive Browser images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing images
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          for image in \
            "ghcr.io/juloc/julos-adaptive-browser-runtime:$version" \
            "ghcr.io/juloc/julos-adaptive-browser-provider:$version"; do
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Adaptive Browser image version already exists: $image" >&2
              exit 1
            fi
          done

      - name: Publish Adaptive Browser runtime
        id: runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/JulOS.AdaptiveBrowser/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/juloc/julos-adaptive-browser-runtime:${{ needs.validate.outputs.version }}
          build-args: |
            JULOS_VERSION=${{ needs.validate.outputs.version }}
          cache-from: type=gha,scope=julos-adaptive-browser-runtime
          cache-to: type=gha,mode=max,scope=julos-adaptive-browser-runtime
          provenance: false
          sbom: true

      - name: Attest Adaptive Browser runtime
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/juloc/julos-adaptive-browser-runtime
          subject-digest: ${{ steps.runtime.outputs.digest }}
          push-to-registry: true

      - name: Publish Adaptive Browser provider
        id: provider
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/JulOS.AdaptiveBrowser/provider/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/juloc/julos-adaptive-browser-provider:${{ needs.validate.outputs.version }}
          build-args: |
            JULOS_VERSION=${{ needs.validate.outputs.version }}
          cache-from: type=gha,scope=julos-adaptive-browser-provider
          cache-to: type=gha,mode=max,scope=julos-adaptive-browser-provider
          provenance: false
          sbom: true

      - name: Attest Adaptive Browser provider
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/juloc/julos-adaptive-browser-provider
          subject-digest: ${{ steps.provider.outputs.digest }}
          push-to-registry: true

      - name: Publication summary
        shell: bash
        run: |
          {
            echo "### Adaptive Browser ${{ needs.validate.outputs.version }}"
            echo
            echo "- Runtime: ghcr.io/juloc/julos-adaptive-browser-runtime@${{ steps.runtime.outputs.digest }}"
            echo "- Provider: ghcr.io/juloc/julos-adaptive-browser-provider@${{ steps.provider.outputs.digest }}"
            echo
            echo "Pin the Runtime digest in deploy/runtime-pins/adaptive-browser-runtime.txt before the JulOS prerelease."
          } >> "$GITHUB_STEP_SUMMARY"
