name: Complete REM-005 input and resize acceptance

on:
  push:
    branches:
      - agent/rem-005-input-resize-acceptance
    paths:
      - .github/workflows/complete-rem-005-input-resize.yml

permissions:
  contents: write

concurrency:
  group: complete-rem-005-input-resize
  cancel-in-progress: false

jobs:
  complete:
    if: github.repository == 'Juloc/julos'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the acceptance branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-005-input-resize-acceptance
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Generate package files
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/complete-rem-005-input-resize.py
          cd packages/JulOS.Remote/frontend
          npm ci
          npm run build
          node --check remote.js
          cd ../../..
          node tools/normalize-encoding.mjs
          git diff --check

      - name: Commit generated product files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/complete-rem-005-input-resize.yml
          rm tools/complete-rem-005-input-resize.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(remote): complete input and resize acceptance'
          git push origin HEAD:agent/rem-005-input-resize-acceptance
