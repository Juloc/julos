test('resize delivery collapses repeated observations and disposal cancels pending work', () => {
  let nextId = 0;
  const pending = new Map();
  const delays = [];
  const timers = {
    setTimeout(callback, delay) {
      nextId += 1;
      pending.set(nextId, callback);
      delays.push(delay);
      return nextId;
    },
    clearTimeout(id) {
      pending.delete(id);
    },
  };
  let runs = 0;
  const scheduler = createResizeScheduler(() => { runs += 1; }, 150, timers);

  scheduler.schedule();
  scheduler.schedule();
  scheduler.schedule();
  assert.equal(pending.size, 1);
  assert.deepEqual(delays, [150, 150, 150]);
  assert.equal(runs, 0);

  const callback = [...pending.values()][0];
  callback();
  assert.equal(runs, 1);

  scheduler.schedule();
  scheduler.dispose();
  assert.equal(pending.size, 0);
  assert.equal(runs, 1);
});

