              '''export function createResizeScheduler(callback, delay = 150, timers = globalThis) {
  let timeout = null;
  let disposed = false;

  const run = () => {
    timeout = null;
    if (!disposed) {
      callback();
    }
  };

  return {
    schedule() {
      if (disposed) {
        return;
      }
      if (timeout !== null) {
        timers.clearTimeout(timeout);
      }
      timeout = timers.setTimeout(run, delay);
    },
    flush() {
      if (disposed) {
        return;
      }
      if (timeout !== null) {
        timers.clearTimeout(timeout);
        timeout = null;
      }
      callback();
    },
    dispose() {
      disposed = true;
      if (timeout !== null) {
        timers.clearTimeout(timeout);
        timeout = null;
      }
    },
