name: Complete REM-005 input and resize acceptance

on:
  push:
    branches:
      - agent/rem-005-input-resize-acceptance
    paths:
      - .github/workflows/complete-rem-005-input-resize.yml

permissions:
  contents: write

concurrency:
  group: complete-rem-005-input-resize
  cancel-in-progress: false

jobs:
  complete:
    if: github.repository == 'Juloc/julos'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the acceptance branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-005-input-resize-acceptance
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Apply and validate the acceptance slice
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/complete-rem-005-input-resize.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/JulOS.Remote/frontend/test/remote.source.test.mjs')
          text = path.read_text(encoding='utf-8-sig')
          old = '''  const callback = [...pending.values()][0];
  callback();
  assert.equal(runs, 1);
'''
          new = '''  const [firedId, callback] = [...pending.entries()][0];
  pending.delete(firedId);
  callback();
  assert.equal(runs, 1);
'''
          if text.count(old) != 1:
              raise RuntimeError('Expected the generated fake-timer callback anchor exactly once.')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          cd packages/JulOS.Remote/frontend
          npm ci
          npm run build
          npm test
          node --check remote.js
          cd ../../..
          node tools/normalize-encoding.mjs
          git diff --check

      - name: Commit the completed acceptance slice
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/complete-rem-005-input-resize.yml
          rm tools/complete-rem-005-input-resize.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(remote): complete input and resize acceptance'
          git push origin HEAD:agent/rem-005-input-resize-acceptance
