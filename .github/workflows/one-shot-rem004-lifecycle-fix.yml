name: One-shot REM-004 lifecycle fix

on:
  push:
    branches:
      - agent/rem-004-lifecycle-cleanup
    paths:
      - .github/workflows/one-shot-rem004-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rem-004-lifecycle-cleanup
          fetch-depth: 0
      - name: Apply focused lifecycle changes
        shell: python
        run: |
          from pathlib import Path

          lifecycle = Path("src/JulOS.Infrastructure/Remote/PostgresRemoteSessionLifecycleService.cs")
          text = lifecycle.read_text(encoding="utf-8-sig")
          text = text.replace(
              "                    && (row.ExpiresAtUtc <= now\n                        || row.RequestDeadlineUtc <= now\n                        || row.LastActivityAtUtc <= earliestIdle))",
              "                    && (row.ExpiresAtUtc <= now\n                        || row.LastActivityAtUtc <= earliestIdle))")
          text = text.replace(
              "        row.CancellationReason = request.Reason;\n",
              "")
          old_due = """    private static bool IsDue(RemoteSessionRow row, DateTimeOffset now)\n    {\n        if (row.ExpiresAtUtc <= now)\n        {\n            return true;\n        }\n        if (row.LastActivityAtUtc.AddSeconds(row.IdleTimeoutSeconds) <= now)\n        {\n            return true;\n        }\n        return row.State is RemoteSessionStates.Requested\n            or RemoteSessionStates.Provisioning\n            or RemoteSessionStates.Connecting\n            && row.RequestDeadlineUtc <= now;\n    }\n"""
          new_due = """    private static bool IsDue(RemoteSessionRow row, DateTimeOffset now) =>\n        row.ExpiresAtUtc <= now\n        || row.LastActivityAtUtc.AddSeconds(row.IdleTimeoutSeconds) <= now;\n"""
          if old_due not in text:
              raise SystemExit("Expected IsDue block not found")
          lifecycle.write_text(text.replace(old_due, new_due), encoding="utf-8-sig")

          worker = Path("src/JulOS.Server/Remote/RemoteSessionLifecycleWorker.cs")
          worker.parent.mkdir(parents=True, exist_ok=True)
          worker.write_text("""using JulOS.Application.Remote;\n\nnamespace JulOS.Server.Remote;\n\n/// <summary>Periodically expires stale Remote sessions and removes terminal runtimes.</summary>\ninternal sealed class RemoteSessionLifecycleWorker : BackgroundService\n{\n    private static readonly TimeSpan Interval = TimeSpan.FromSeconds(30);\n    private static readonly Action<ILogger, int, Exception?> CleanupFailures = LoggerMessage.Define<int>(\n        LogLevel.Warning,\n        new EventId(6101, nameof(CleanupFailures)),\n        \"Remote lifecycle reconciliation left {FailureCount} runtime cleanup failures.\");\n    private static readonly Action<ILogger, Exception?> ReconciliationFailed = LoggerMessage.Define(\n        LogLevel.Error,\n        new EventId(6102, nameof(ReconciliationFailed)),\n        \"Remote lifecycle reconciliation failed.\");\n\n    private readonly IServiceScopeFactory scopeFactory;\n    private readonly TimeProvider timeProvider;\n    private readonly ILogger<RemoteSessionLifecycleWorker> logger;\n\n    public RemoteSessionLifecycleWorker(\n        IServiceScopeFactory scopeFactory,\n        TimeProvider timeProvider,\n        ILogger<RemoteSessionLifecycleWorker> logger)\n    {\n        this.scopeFactory = scopeFactory ?? throw new ArgumentNullException(nameof(scopeFactory));\n        this.timeProvider = timeProvider ?? throw new ArgumentNullException(nameof(timeProvider));\n        this.logger = logger ?? throw new ArgumentNullException(nameof(logger));\n    }\n\n    protected override async Task ExecuteAsync(CancellationToken stoppingToken)\n    {\n        while (!stoppingToken.IsCancellationRequested)\n        {\n            await Task.Delay(Interval, this.timeProvider, stoppingToken).ConfigureAwait(false);\n            await this.ReconcileAsync(stoppingToken).ConfigureAwait(false);\n        }\n    }\n\n    private async Task ReconcileAsync(CancellationToken cancellationToken)\n    {\n        try\n        {\n            await using var scope = this.scopeFactory.CreateAsyncScope();\n            var lifecycle = scope.ServiceProvider.GetRequiredService<IRemoteSessionLifecycleService>();\n            var result = await lifecycle.ReconcileDueAsync(100, cancellationToken).ConfigureAwait(false);\n            if (result.CleanupFailures > 0)\n            {\n                CleanupFailures(this.logger, result.CleanupFailures, null);\n            }\n        }\n        catch (OperationCanceledException) when (cancellationToken.IsCancellationRequested)\n        {\n        }\n        catch (Exception exception)\n        {\n            ReconciliationFailed(this.logger, exception);\n        }\n    }\n}\n""", encoding="utf-8-sig")

          program = Path("src/JulOS.Server/Program.cs")
          program_text = program.read_text(encoding="utf-8-sig")
          program_text = program_text.replace(
              "using JulOS.Server.Profile;\n",
              "using JulOS.Server.Profile;\nusing JulOS.Server.Remote;\n")
          program_text = program_text.replace(
              "builder.Services.AddJulOsRemoteOrchestration(builder.Configuration);\n",
              "builder.Services.AddJulOsRemoteOrchestration(builder.Configuration);\nbuilder.Services.AddHostedService<RemoteSessionLifecycleWorker>();\n")
          program.write_text(program_text, encoding="utf-8-sig")

          Path(".github/workflows/one-shot-rem004-lifecycle-fix.yml").unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(remote): run lifecycle cleanup in the server"
          git push origin HEAD:agent/rem-004-lifecycle-cleanup
