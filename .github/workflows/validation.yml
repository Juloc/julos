# Repository validation.
#
# This workflow runs tools/validate.sh, the same entry point developers run.
# Continuous integration must not grow its own list of checks; a stage belongs
# in tools/validate.mjs so both places stay identical by construction.

name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-agt003:
    if: >-
      github.event_name == 'pull_request'
      && github.head_ref == 'agent/julos-1.0-agent-command-capabilities'
      && github.actor != 'github-actions[bot]'
    name: Integrate the reviewed AGT-003 source changes once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact transformations
        shell: pwsh
        run: |
          function Replace-ExactlyOnce {
            param(
              [string] $Path,
              [string] $Before,
              [string] $After,
              [string] $Label
            )
            $source = [System.IO.File]::ReadAllText($Path).Replace("`r`n", "`n")
            $matches = [regex]::Matches($source, [regex]::Escape($Before)).Count
            if ($matches -ne 1) {
              throw "$Label expected exactly one source match, found $matches."
            }
            $source = $source.Replace($Before, $After).Replace("`n", "`r`n")
            [System.IO.File]::WriteAllText($Path, $source, [System.Text.UTF8Encoding]::new($true))
          }

          $serviceBefore = @'
                  if (existing is not null)
                  {
                      return ToResponse(existing);
                  }

                  var now = this.timeProvider.GetUtcNow();
          '@.TrimStart("`n")
          $serviceAfter = @'
                  if (existing is not null)
                  {
                      return ToResponse(existing);
                  }

                  await this.EnsureCommandAdvertisedAsync(
                      agentId,
                      request.CommandType,
                      cancellationToken).ConfigureAwait(false);

                  var now = this.timeProvider.GetUtcNow();
          '@.TrimStart("`n")
          Replace-ExactlyOnce `
            'src/JulOS.Infrastructure/Agents/PostgresAgentControlService.cs' `
            $serviceBefore `
            $serviceAfter `
            'CreateCommandAsync insertion'

          $testBefore = @'
                          JsonSerializer.SerializeToElement(new { platform = "linux" })),
                  ],
                  observedAt);
          '@.TrimStart("`n")
          $testAfter = @'
                          JsonSerializer.SerializeToElement(new { platform = "linux" })),
                      new AgentCapabilityContract(
                          "agent.commands.core",
                          1,
                          Enabled: true,
                          MetadataVersion: 1,
                          JsonSerializer.SerializeToElement(new
                          {
                              commands = new[] { "diagnostics.snapshot" },
                          })),
                  ],
                  observedAt);
          '@.TrimStart("`n")
          Replace-ExactlyOnce `
            'tests/JulOS.Integration.Tests/Agents/AgentEndpointTests.cs' `
            $testBefore `
            $testAfter `
            'Agent lifecycle command advertisement'

      - name: Remove temporary integration wiring and commit
        run: |
          git fetch origin agent/julos-1.0-agent-enrollment-bootstrap-clean
          git show origin/agent/julos-1.0-agent-enrollment-bootstrap-clean:.github/workflows/validation.yml > .github/workflows/validation.yml
          git rm .github/workflows/apply-agt003.yml
          git add \
            .github/workflows/validation.yml \
            src/JulOS.Infrastructure/Agents/PostgresAgentControlService.cs \
            tests/JulOS.Integration.Tests/Agents/AgentEndpointTests.cs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(agent): require advertised commands before queueing"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    name: Validate the repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run repository validation
        run: sh tools/validate.sh

      - name: Capture validation working-tree diagnostics
        if: always()
        run: |
          git status --short > validation-working-tree.txt
          git diff --name-only > validation-changed-files.txt
          git diff --stat > validation-diff-stat.txt
          git diff --binary > validation-working-tree.patch

      - name: Upload validation working-tree diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-working-tree-${{ github.run_id }}
          path: |
            validation-working-tree.txt
            validation-changed-files.txt
            validation-diff-stat.txt
            validation-working-tree.patch
          if-no-files-found: error
          retention-days: 7

      - name: Verify the working tree is unchanged
        run: |
          git status --short
          git diff --stat
          git diff --exit-code
