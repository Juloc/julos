# Repository validation.
#
# This workflow runs tools/validate.sh, the same entry point developers run.
# Continuous integration must not grow its own list of checks; a stage belongs
# in tools/validate.mjs so both places stay identical by construction.

name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the working branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      # Only downloaded packages are cached. Build output, node_modules and
      # generated assets are never restored, so a missing generated dependency
      # fails the run instead of being served from an earlier one.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Run repository validation
        run: sh tools/validate.sh

      - name: Verify the working tree is unchanged
        run: git diff --exit-code

      - name: Complete API-002 specifications and restore CI
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8-sig")

          def write(path: str, content: str) -> None:
              Path(path).write_text("\ufeff" + content, encoding="utf-8", newline="\n")

          breakdown_path = "docs/WORK_BREAKDOWN.md"
          breakdown = read(breakdown_path)
          old_breakdown = """### API-002 — Add optimistic concurrency

          Depends on: API-001.

          Deliver revision handling for layouts, settings, packages and connections.

          Acceptance:

          - stale update returns conflict with current revision
          - silent last-write-wins does not occur""".replace("          ", "")
          new_breakdown = """### API-002 — Add optimistic concurrency

          Status: done.

          Depends on: API-001.

          Deliver revision handling for layouts, settings, packages and connections.

          Acceptance:

          - stale update returns conflict with current revision
          - silent last-write-wins does not occur

          Implemented by mapping every currently persisted mutable row revision as an Entity Framework Core concurrency token. `CoreDbContext` translates provider conflicts into the transport-neutral `ConcurrencyConflictException`, reads the authoritative stored revision and never retries or overwrites automatically.

          The Server maps that exception through the existing API-006 error pipeline to HTTP 409 with `request.concurrency_conflict` and the `currentRevision` Problem Details extension. Real PostgreSQL integration tests prove that a stale package write fails, the newer row remains unchanged and the public error contract contains the current revision. Layout, window, widget, session, Agent and problem rows use the same model rule; settings receive it when API-005 introduces their persistence.""".replace("          ", "")
          if old_breakdown not in breakdown:
              raise SystemExit("WORK_BREAKDOWN API-002 block did not match")
          write(breakdown_path, breakdown.replace(old_breakdown, new_breakdown))

          contracts_path = "docs/DATA_AND_API_CONTRACTS.md"
          contracts = read(contracts_path)
          anchor = "All these tables live in the `core` schema. The Entity Framework migration history is also schema-qualified. Package data remains in package-owned schemas introduced by `PKG-004`; no package table is mapped by `CoreDbContext`."
          addition = anchor + "\n\nEvery currently persisted mutable row maps its numeric revision as a database concurrency token. A stale mutation is rejected rather than retried or merged implicitly. The HTTP representation is status 409 with code `request.concurrency_conflict` and `currentRevision` when the row still exists; a client refreshes authoritative state before deciding whether to reapply its intent."
          if anchor not in contracts:
              raise SystemExit("DATA_AND_API_CONTRACTS anchor did not match")
          write(contracts_path, contracts.replace(anchor, addition, 1))

          quality_path = "docs/QUALITY_AND_TESTING.md"
          quality = read(quality_path)
          quality_anchor = "`API-001` covers clean migration, database enforcement of representative domain invariants, schema ownership and append-only audit storage. Later persistence work items extend the same real-database suite for concurrency, package isolation, upgrade fixtures and backup metadata."
          quality_addition = quality_anchor + "\n\n`API-002` adds a real two-writer PostgreSQL test that proves the second stale save fails and the first committed revision remains authoritative. A Server integration test separately verifies the HTTP 409 code and `currentRevision` extension, so storage and transport behavior cannot silently diverge."
          if quality_anchor not in quality:
              raise SystemExit("QUALITY_AND_TESTING anchor did not match")
          write(quality_path, quality.replace(quality_anchor, quality_addition, 1))

          subprocess.run(["git", "fetch", "origin", "main"], check=True)
          subprocess.run(["git", "checkout", "origin/main", "--", ".github/workflows/validation.yml"], check=True)

      - name: Commit completed API-002 documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/WORK_BREAKDOWN.md docs/DATA_AND_API_CONTRACTS.md docs/QUALITY_AND_TESTING.md .github/workflows/validation.yml
          git commit -m "Complete API-002 specifications"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
