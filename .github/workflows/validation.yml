# Repository validation.
#
# This workflow runs tools/validate.sh, the same entry point developers run.
# Continuous integration must not grow its own list of checks; a stage belongs
# in tools/validate.mjs so both places stay identical by construction.

name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-rem-004:
    name: Normalize REM-004 source
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/rem-004-runtime-allocation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-004-runtime-allocation
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
      - name: Normalize and restore validation workflow
        shell: bash
        run: |
          set -euo pipefail
          node tools/normalize-encoding.mjs
          git fetch --depth=1 origin agent/complete-julos-work-breakdown
          git show FETCH_HEAD:.github/workflows/validation.yml > .github/workflows/validation.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(remote): normalize runtime allocation source'
          git push origin HEAD:agent/rem-004-runtime-allocation

  validate:
    name: Validate the repository
    if: github.head_ref != 'agent/rem-004-runtime-allocation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      # Only downloaded packages are cached. Build output, node_modules and
      # generated assets are never restored, so a missing generated dependency
      # fails the run instead of being served from an earlier one.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run repository validation
        run: sh tools/validate.sh

      - name: Capture validation working-tree diagnostics
        if: always()
        run: |
          git status --short > validation-working-tree.txt
          git diff --name-only > validation-changed-files.txt
          git diff --stat > validation-diff-stat.txt
          git diff --binary > validation-working-tree.patch

      - name: Upload validation working-tree diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-working-tree-${{ github.run_id }}
          path: |
            validation-working-tree.txt
            validation-changed-files.txt
            validation-diff-stat.txt
            validation-working-tree.patch
          if-no-files-found: error
          retention-days: 7

      # The validation must not modify tracked files. A difference here means a
      # generated artefact is committed out of date. Print the paths and diff
      # summary first so the required deterministic update is actionable.
      - name: Verify the working tree is unchanged
        run: |
          git status --short
          git diff --stat
          git diff --exit-code
