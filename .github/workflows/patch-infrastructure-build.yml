name: Apply Infrastructure compiler fixes

on:
  push:
    branches:
      - agent/complete-julos-work-breakdown

permissions:
  contents: write

concurrency:
  group: patch-infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0

      - name: Apply exact replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/JulOS.Infrastructure/Agents/PostgresAgentControlService.cs': [
                  (b'normalized.Length % 4 switch', b'(normalized.Length % 4) switch'),
              ],
              'src/JulOS.Infrastructure/Packages/PackageArtifactVerifier.cs': [
                  (b'private readonly IReadOnlyDictionary<string, TrustedPackagePublisher> trustedPublishers;',
                   b'private readonly Dictionary<string, TrustedPackagePublisher> trustedPublishers;'),
              ],
          }

          for name, changes in replacements.items():
              path = Path(name)
              data = path.read_bytes()
              for old, new in changes:
                  if old not in data:
                      raise SystemExit(f'missing expected text in {name}: {old!r}')
                  data = data.replace(old, new, 1)
              path.write_bytes(data)
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/JulOS.Infrastructure
          git commit -m "Fix remaining Infrastructure compiler errors"
          git push origin HEAD:agent/complete-julos-work-breakdown
