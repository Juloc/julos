# One-shot branch-local analyzer fix. Removed by its own commit.
name: Fix REM-004 integration analyzer

on:
  pull_request:
    paths:
      - .github/workflows/fix-rem004-integration-analyzer.yml

permissions:
  contents: write

concurrency:
  group: fix-rem004-integration-analyzer
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'Juloc/julos' && github.head_ref == 'agent/rem-004-runtime-allocation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-004-runtime-allocation
          persist-credentials: true
      - name: Apply analyzer fix
        shell: bash
        run: |
          set -euo pipefail
          file=tests/JulOS.Integration.Tests/Remote/RemoteSessionServiceTests.cs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/JulOS.Integration.Tests/Remote/RemoteSessionServiceTests.cs')
          data = path.read_text(encoding='utf-8-sig')
          old = 'private static IReadOnlyDictionary<string, string?> RuntimeSettings(Guid networkProfileId)'
          new = 'private static Dictionary<string, string?> RuntimeSettings(Guid networkProfileId)'
          if data.count(old) != 1:
              raise SystemExit('Expected RuntimeSettings signature was not found exactly once.')
          path.write_text('\ufeff' + data.replace(old, new), encoding='utf-8', newline='\r\n')
          PY
          git rm .github/workflows/fix-rem004-integration-analyzer.yml
          git add "$file"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(remote): satisfy integration test analyzer'
          git push origin HEAD:agent/rem-004-runtime-allocation
