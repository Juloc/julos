name: Agent clean-tree diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-clean-tree-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'agent/complete-julos-work-breakdown'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULOS_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=julos;Password=julos-test-only

    services:
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: julos
          POSTGRES_PASSWORD: julos-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=julos --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc
          cache: npm
          cache-dependency-path: src/JulOS.Desktop/package-lock.json

      - name: Run repository validation
        run: sh tools/validate.sh

      - name: Record exact tracked-file changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-diagnostic
          {
            echo '=== status ==='
            git status --short
            echo
            echo '=== diff stat ==='
            git diff --stat
            echo
            echo '=== diff ==='
            git diff --no-ext-diff --text
          } > .agent-diagnostic/clean-tree.txt
          test -s .agent-diagnostic/clean-tree.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-diagnostic/clean-tree.txt
          git commit -m 'Record validation clean-tree difference'
          git push origin HEAD:${{ github.head_ref }}
