# One-shot EF migration generation for REM-004. Removed after the generated commit.
name: Generate REM-004 session migration

on:
  push:
    branches:
      - agent/rem-004-durable-session-service
    paths:
      - .github/workflows/generate-rem-004-session-migration.yml
  pull_request:
    paths:
      - .github/workflows/generate-rem-004-session-migration.yml

permissions:
  contents: write

concurrency:
  group: generate-rem-004-session-migration
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Juloc/julos' && (github.event_name == 'push' || github.head_ref == 'agent/rem-004-durable-session-service')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-004-durable-session-service
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Generate and verify migration
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/rem004-generator.log"
          migration_dir="src/JulOS.Infrastructure/Persistence/Core/Migrations"
          snapshot="$migration_dir/CoreDbContextModelSnapshot.cs"
          before_snapshot="$(sha256sum "$snapshot" | cut -d' ' -f1)"
          status=0

          {
            set -e
            dotnet tool restore
            dotnet restore JulOS.slnx
            dotnet build JulOS.slnx --configuration Release --no-restore
            dotnet ef migrations add AddDurableRemoteSessions \
              --project src/JulOS.Infrastructure/JulOS.Infrastructure.csproj \
              --startup-project src/JulOS.Server/JulOS.Server.csproj \
              --context CoreDbContext \
              --output-dir Persistence/Core/Migrations \
              --configuration Release \
              --no-build \
              --verbose
            node tools/normalize-encoding.mjs
            git diff --check

            mapfile -t generated < <(find "$migration_dir" -maxdepth 1 -type f -name '*_AddDurableRemoteSessions*.cs' | sort)
            test "${#generated[@]}" -eq 2
            after_snapshot="$(sha256sum "$snapshot" | cut -d' ' -f1)"
            test "$after_snapshot" != "$before_snapshot"
            git status --short -- "$migration_dir"
          } >"$log" 2>&1 || status=$?

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ "$status" -ne 0 ]]; then
            {
              tail -n 350 "$log"
              echo '--- migration directory ---'
              find "$migration_dir" -maxdepth 2 -type f -printf '%p\n' | sort
              echo '--- git status ---'
              git status --short
            } > REM004-GENERATOR-FAILURE.log
            git add -f REM004-GENERATOR-FAILURE.log
            git commit -m 'ci(remote): capture session migration generator failure'
            git push origin HEAD:agent/rem-004-durable-session-service
            exit "$status"
          fi

          rm -f REM004-GENERATOR-FAILURE.log
          git add "$migration_dir"
          git commit -m 'feat(remote): add durable session migration'
          git push origin HEAD:agent/rem-004-durable-session-service
