# Temporary branch-local source export. Removed before review.
name: Export REM-004 source

on:
  push:
    branches:
      - agent/rem-004-runtime-allocation
  pull_request:
    paths:
      - .github/workflows/export-rem-004-source.yml

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'Juloc/julos'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude='**/bin' \
            --exclude='**/obj' \
            --exclude='**/node_modules' \
            --exclude='**/dist' \
            -czf "$RUNNER_TEMP/rem004-source.tar.gz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: rem004-source-${{ github.run_id }}
          path: ${{ runner.temp }}/rem004-source.tar.gz
          if-no-files-found: error
          retention-days: 1
