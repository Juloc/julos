name: Generate infrastructure packages

on:
  push:
    branches:
      - agent/complete-julos-work-breakdown

permissions:
  contents: write

concurrency:
  group: generate-infrastructure-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/complete-julos-work-breakdown
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/JulOS.Desktop/.nvmrc

      - name: Generate isolated package sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          packages = [
              {
                  'folder': 'JulOS.Docker', 'id': 'de.juloc.julos.docker', 'key': 'docker',
                  'capability': 'docker.containers', 'operation': 'list', 'widget': True,
                  'title_en': 'Docker', 'title_de': 'Docker',
              },
              {
                  'folder': 'JulOS.Proxmox', 'id': 'de.juloc.julos.proxmox', 'key': 'proxmox',
                  'capability': 'proxmox.resources', 'operation': 'list', 'widget': True,
                  'title_en': 'Proxmox', 'title_de': 'Proxmox',
              },
              {
                  'folder': 'JulOS.Files', 'id': 'de.juloc.julos.files', 'key': 'files',
                  'capability': 'files.entries', 'operation': 'list', 'widget': False,
                  'title_en': 'Files', 'title_de': 'Dateien',
              },
              {
                  'folder': 'JulOS.Caddy', 'id': 'de.juloc.julos.caddy', 'key': 'caddy',
                  'capability': 'caddy.routes', 'operation': 'list', 'widget': True,
                  'title_en': 'Caddy', 'title_de': 'Caddy',
              },
              {
                  'folder': 'JulOS.Discovery', 'id': 'de.juloc.julos.discovery', 'key': 'discovery',
                  'capability': 'discovery.scan', 'operation': 'start', 'widget': False,
                  'title_en': 'Discovery', 'title_de': 'Erkennung',
              },
          ]

          template = '''export async function register(context) {{
            class PackageApp extends HTMLElement {{
              connectedCallback() {{
                const shadow = this.attachShadow({{ mode: 'open' }});
                const heading = document.createElement('h1');
                const action = document.createElement('button');
                const status = document.createElement('p');
                const output = document.createElement('pre');
                heading.textContent = context.language === 'de' ? {title_de!r} : {title_en!r};
                action.type = 'button';
                action.textContent = context.language === 'de' ? 'Aktualisieren' : 'Refresh';
                action.addEventListener('click', () => {{
                  status.textContent = context.language === 'de' ? 'Wird geladen' : 'Loading';
                  void context.invokeCapability({capability!r}, {operation!r}, {{}}).then((result) => {{
                    output.textContent = JSON.stringify(result, null, 2);
                    status.textContent = context.language === 'de' ? 'Aktuell' : 'Current';
                  }}).catch(() => {{
                    status.textContent = context.language === 'de'
                      ? 'Offline oder nicht erlaubt.'
                      : 'Offline or unauthorized.';
                  }});
                }});
                shadow.append(heading, action, status, output);
              }}
            }}
            if (!customElements.get({app_element!r})) {{
              customElements.define({app_element!r}, PackageApp);
            }}
            {widget_code}
          }}
          '''

          for item in packages:
              key = item['key']
              app_element = f'julos-{key}-app'
              widget_element = f'julos-{key}-widget'
              widget_code = ''
              if item['widget']:
                  widget_code = f'''class PackageWidget extends HTMLElement {{
                connectedCallback() {{
                  const shadow = this.attachShadow({{ mode: 'open' }});
                  const button = document.createElement('button');
                  button.type = 'button';
                  button.textContent = context.language === 'de' ? {item['title_de']!r} : {item['title_en']!r};
                  button.addEventListener('click', () => context.openApplication({key!r}));
                  shadow.append(button);
                }}
              }}
              if (!customElements.get({widget_element!r})) {{
                customElements.define({widget_element!r}, PackageWidget);
              }}'''
              source = template.format(
                  title_de=item['title_de'], title_en=item['title_en'],
                  capability=item['capability'], operation=item['operation'],
                  app_element=app_element, widget_code=widget_code)
              frontend_dir = Path('packages') / item['folder'] / 'frontend'
              frontend_dir.mkdir(parents=True, exist_ok=True)
              (frontend_dir / f'{key}.js').write_text(source, encoding='utf-8')
          PY
          node tools/normalize-encoding.mjs

      - name: Build canonical manifests with actual digests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          packages = [
              ('JulOS.Docker', 'de.juloc.julos.docker', 'docker', 'docker.containers', True, 1000, 720),
              ('JulOS.Proxmox', 'de.juloc.julos.proxmox', 'proxmox', 'proxmox.resources', True, 1100, 760),
              ('JulOS.Files', 'de.juloc.julos.files', 'files', 'files.entries', False, 1000, 720),
              ('JulOS.Caddy', 'de.juloc.julos.caddy', 'caddy', 'caddy.routes', True, 1080, 740),
              ('JulOS.Discovery', 'de.juloc.julos.discovery', 'discovery', 'discovery.scan', False, 900, 660),
          ]
          for folder, package_id, key, capability, widget, width, height in packages:
              module = Path(f'packages/{folder}/frontend/{key}.js')
              digest = hashlib.sha256(module.read_bytes()).hexdigest()
              widgets = []
              exported = [f'julos-{key}-app']
              if widget:
                  widgets.append({
                      'StableKey': f'{key}-summary',
                      'DisplayNameKey': f'widget.{key}.summary.name',
                      'ElementName': f'julos-{key}-widget',
                      'Sizes': ['small', 'medium'],
                      'DefaultSize': 'small',
                  })
                  exported.append(f'julos-{key}-widget')
              manifest = {
                  'SchemaVersion': '1',
                  'PackageId': package_id,
                  'Version': '1.0.0',
                  'PublisherId': 'juloc-official',
                  'DisplayNameKey': f'package.{key}.name',
                  'DescriptionKey': f'package.{key}.description',
                  'Runtime': {
                      'Kind': 'none', 'Image': None, 'EntryPoint': None,
                      'MemoryLimitMegabytes': 16, 'CpuLimit': 0.1,
                      'StartupTimeoutSeconds': 10, 'NetworkAccess': False,
                  },
                  'Permissions': ['core.system.version.read'],
                  'Applications': [{
                      'StableKey': key,
                      'DisplayNameKey': f'app.{key}.name',
                      'InstancePolicy': 'single-instance-per-user',
                      'DefaultWidth': width, 'DefaultHeight': height,
                      'MinimumWidth': 420, 'MinimumHeight': 320,
                      'Viewports': ['desktop', 'tablet', 'mobile'],
                  }],
                  'Widgets': widgets,
                  'Capabilities': [{
                      'Name': capability,
                      'Direction': 'requires',
                      'ContractVersion': '1.0.0',
                      'Required': True,
                  }],
                  'Migrations': [],
                  'Frontend': {
                      'ModulePath': f'frontend/{key}.js',
                      'Sha256': digest,
                      'ExportedElements': exported,
                  },
              }
              path = Path('packages') / folder / 'manifest.json'
              path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          node tools/normalize-encoding.mjs

      - name: Commit permanent packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-infrastructure-packages.yml
          git add packages/JulOS.Docker packages/JulOS.Proxmox packages/JulOS.Files packages/JulOS.Caddy packages/JulOS.Discovery
          git commit -m "Add infrastructure package frontends"
          git pull --rebase origin agent/complete-julos-work-breakdown
          git push origin HEAD:agent/complete-julos-work-breakdown
