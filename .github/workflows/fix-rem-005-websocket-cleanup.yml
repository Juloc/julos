name: Fix REM-005 WebSocket cleanup

on:
  push:
    branches:
      - agent/rem-005-display-transport
    paths:
      - .github/workflows/fix-rem-005-websocket-cleanup.yml
  pull_request:
    branches:
      - agent/complete-julos-work-breakdown
    paths:
      - .github/workflows/fix-rem-005-websocket-cleanup.yml

permissions:
  contents: write

concurrency:
  group: fix-rem-005-websocket-cleanup
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'Juloc/julos' && (github.ref == 'refs/heads/agent/rem-005-display-transport' || github.head_ref == 'agent/rem-005-display-transport')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/rem-005-display-transport
          persist-credentials: true

      - name: Remove redundant close race
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/JulOS.Integration.Tests/Remote/RemoteDisplayEndpointTests.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = '''
        if (socket.State == WebSocketState.Open)
        {
            await socket.CloseAsync(
                WebSocketCloseStatus.NormalClosure,
                "test complete",
                cancellation.Token).ConfigureAwait(false);
        }
'''
          if text.count(old) != 1:
              raise RuntimeError('Expected one explicit WebSocket cleanup block.')
          path.write_text(text.replace(old, '\n'), encoding='utf-8', newline='\n')
          PY
          node tools/normalize-encoding.mjs
          git diff --check

      - name: Commit corrected test cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add tests/JulOS.Integration.Tests/Remote/RemoteDisplayEndpointTests.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(remote): avoid websocket close race in integration test'
          git push origin HEAD:agent/rem-005-display-transport
