name: Beta4 renormalize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  renormalize:
    if: github.event.pull_request.head.ref == 'fix/browser-package-refresh-beta4' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Normalize changed text files
        shell: bash
        run: |
          set -euo pipefail
          node tools/normalize-encoding.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --renormalize docs/releases/0.4.0-beta.4.md packages/JulOS.Remote/manifest.json packages/JulOS.HostMetrics/manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: normalize Beta4 package metadata'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
